<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video to Audio Converter</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500&family=Roboto:wght@400;500&family=Roboto+Mono&display=swap"
    rel="stylesheet">
  <!-- Google Material Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,0,0" />
  <!-- JSZip for batch ZIP export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-color: #f8f9fa;
      --border-color: #dadce0;
      --primary-blue: #1a73e8;
      --primary-hover: #174ea6;
      --success-bg: #e6f4ea;
      --success-text: #137333;
      --danger-bg: #fce8e6;
      --danger-text: #c5221f;
      --text-main: #202124;
      --text-secondary: #5f6368;
    }

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #ffffff;
      color: var(--text-main);
      box-sizing: border-box;
    }

    h2,
    .btn {
      font-family: 'Google Sans', sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    /* Drop Zone */
    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      background-color: var(--bg-color);
      cursor: pointer;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: var(--primary-blue);
      background-color: #e8f0fe;
    }

    .drop-zone p {
      margin: 8px 0 0 0;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .file-input {
      display: none;
    }

    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: var(--bg-color);
      padding: 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 110px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
    }

    select,
    input[type="number"] {
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: #ffffff;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.3s ease;
    }

    select:focus,
    input[type="number"]:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 1px var(--primary-blue);
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--primary-blue);
    }

    /* Media Box */
    .media-box {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      background-color: #f1f3f4;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    video, audio {
      width: 100%;
      max-height: 200px;
      border-radius: 4px;
    }

    .media-info {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
      text-align: center;
      margin-top: 4px;
    }

    /* Progress Bar */
    .progress-container {
      display: none;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }

    .progress-bar-bg {
      height: 8px;
      background-color: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--primary-blue);
      transition: width 0.1s linear;
    }

    /* Animation class for Clear */
    .flash-clear {
      animation: clearPulse 0.4s ease-out;
    }

    @keyframes clearPulse {
      0% {
        background-color: var(--bg-color);
      }

      50% {
        background-color: #e8eaed;
      }

      100% {
        background-color: var(--bg-color);
      }
    }

    /* Status Box */
    .status-box {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 6px;
      display: none;
    }

    .status-box.error {
      display: block;
      background-color: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid #f5c6cb;
    }

    .status-box.success {
      display: block;
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid #c3e6cb;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      font-family: 'Google Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: scale(1);
    }

    .material-symbols-outlined {
      font-size: 18px;
    }

    .btn-primary {
      background-color: var(--primary-blue);
      color: white;
      min-width: 170px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
      box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
    }

    .btn-secondary {
      background-color: white;
      color: var(--primary-blue);
      border-color: var(--border-color);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #f8f9fa;
      border-color: #dadce0;
    }

    .btn-success,
    .btn-success:hover {
      background-color: var(--success-bg) !important;
      color: var(--success-text) !important;
      border-color: var(--success-bg) !important;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- Drop Zone -->
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <span class="material-symbols-outlined" style="font-size: 36px; color: var(--primary-blue);">audiotrack</span>
      <p id="dropZoneText">Click or drag & drop video files here (MP4, WebM, MOV, AVI, MKV)</p>
      <input type="file" id="fileInput" class="file-input" accept="video/*" onchange="handleFileSelect(event)">
    </div>

    <!-- Options Panel -->
    <div class="controls-panel" id="controlsPanel">
      <div class="control-row">
        <div class="input-group">
          <label for="targetFormat">Audio Format</label>
          <select id="targetFormat" onchange="toggleFormatOptions()">
            <option value="mp3" selected>MP3 (.mp3 - Universal Compressed)</option>
            <option value="wav">WAV (.wav - Instant Lossless 16-bit)</option>
          </select>
        </div>

        <div class="input-group" id="bitrateGroup">
          <label for="bitrateSelect">MP3 Bitrate</label>
          <select id="bitrateSelect">
            <option value="320" selected>320 kbps (High Quality)</option>
            <option value="192">192 kbps (Standard)</option>
            <option value="128">128 kbps (Compact File)</option>
          </select>
        </div>

        <div class="input-group">
          <label for="volumeGain">Volume Boost (<span id="volVal">100</span>%)</label>
          <input type="range" id="volumeGain" min="50" max="250" value="100" oninput="document.getElementById('volVal').textContent = this.value">
        </div>

        <div class="input-group">
          <label for="channelMode">Channels</label>
          <select id="channelMode">
            <option value="original" selected>Original Channels</option>
            <option value="mono">Convert to Mono (1-Channel)</option>
          </select>
        </div>
      </div>

      <!-- Segment Trimmer -->
      <div class="control-row" style="border-top: 1px solid var(--border-color); padding-top: 10px;">
        <label style="width: 100%; font-weight: 500;">Segment Extraction (Optional)</label>
        <div class="input-group">
          <label for="trimStart">Start Time (sec)</label>
          <input type="number" id="trimStart" min="0" step="0.1" value="0">
        </div>
        <button class="btn-secondary" style="padding: 4px 8px; font-size: 11px; margin-top: 18px;" onclick="setStartToCurrent()">Set Start</button>

        <div class="input-group">
          <label for="trimEnd">End Time (sec)</label>
          <input type="number" id="trimEnd" min="0" step="0.1" value="0" placeholder="0 = Full Video">
        </div>
        <button class="btn-secondary" style="padding: 4px 8px; font-size: 11px; margin-top: 18px;" onclick="setEndToCurrent()">Set End</button>
      </div>
    </div>

    <!-- Progress Indicator -->
    <div class="progress-container" id="progressContainer">
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 500;">
        <span id="progressText">Processing audio stream...</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </div>

    <!-- Media Preview Grid -->
    <div class="grid">
      <!-- Source Video Player -->
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label style="font-weight: 500;">Source Video Input</label>
        <div class="media-box">
          <span id="noVideoText" style="color: var(--text-secondary); font-size: 13px;">Uploaded video will appear here</span>
          <video id="videoPlayer" controls style="display: none;" onloadedmetadata="onVideoLoaded()"></video>
        </div>
        <div id="videoMediaInfo" class="media-info"></div>
      </div>

      <!-- Extracted Audio Player -->
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label style="font-weight: 500;">Extracted Audio Result</label>
        <div class="media-box">
          <span id="noAudioText" style="color: var(--text-secondary); font-size: 13px;">Extracted audio preview will appear here</span>
          <audio id="audioPlayer" controls style="display: none;"></audio>
        </div>
        <div id="audioMediaInfo" class="media-info"></div>
      </div>
    </div>

    <!-- Status Box -->
    <div id="statusBox" class="status-box"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button id="extractBtn" class="btn-primary" onclick="startAudioExtraction()" disabled>
        <span class="material-symbols-outlined" id="extractIcon">bolt</span>
        <span id="extractText">Fast Extract Audio</span>
      </button>

      <button id="downloadBtn" class="btn-secondary" onclick="downloadExtractedAudio()" disabled>
        <span class="material-symbols-outlined" id="downloadIcon">download</span>
        <span id="downloadText">Download Audio</span>
      </button>

      <button class="btn-secondary" onclick="clearAll()" style="color: var(--text-secondary);">
        <span class="material-symbols-outlined">delete</span>
        Clear
      </button>
    </div>
  </div>

  <script>
    let rawVideoFile = null;
    let videoObjectUrl = null;

    let extractedAudioBlob = null;
    let extractedAudioUrl = null;
    let outputExt = 'mp3';

    const dropZone = document.getElementById('dropZone');

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('video/'));
      if (files.length > 0) loadVideo(files[0]);
    });

    function handleFileSelect(event) {
      if (event.target.files.length > 0) {
        loadVideo(event.target.files[0]);
      }
    }

    function loadVideo(file) {
      hideStatus();
      rawVideoFile = file;

      if (videoObjectUrl) URL.revokeObjectURL(videoObjectUrl);
      videoObjectUrl = URL.createObjectURL(file);

      const vPlayer = document.getElementById('videoPlayer');
      vPlayer.src = videoObjectUrl;
      vPlayer.style.display = 'block';
      document.getElementById('noVideoText').style.display = 'none';

      document.getElementById('dropZoneText').textContent = `Loaded: ${file.name} (${formatFileSize(file.size)})`;
      document.getElementById('extractBtn').disabled = false;

      showStatus(`Loaded video file (${formatFileSize(file.size)}). Click Fast Extract Audio to convert.`, 'success');
    }

    function onVideoLoaded() {
      const v = document.getElementById('videoPlayer');
      document.getElementById('videoMediaInfo').innerHTML = `
        <strong>Dimensions:</strong> ${v.videoWidth} × ${v.videoHeight} px | <strong>Duration:</strong> ${formatTime(v.duration)} | <strong>Size:</strong> ${formatFileSize(rawVideoFile.size)}
      `;

      if (!document.getElementById('trimEnd').value || document.getElementById('trimEnd').value === '0') {
        document.getElementById('trimEnd').value = Math.round(v.duration * 10) / 10;
      }
    }

    function toggleFormatOptions() {
      const format = document.getElementById('targetFormat').value;
      document.getElementById('bitrateGroup').style.display = format === 'mp3' ? 'flex' : 'none';
    }

    function setStartToCurrent() {
      const v = document.getElementById('videoPlayer');
      document.getElementById('trimStart').value = Math.round(v.currentTime * 10) / 10;
    }

    function setEndToCurrent() {
      const v = document.getElementById('videoPlayer');
      document.getElementById('trimEnd').value = Math.round(v.currentTime * 10) / 10;
    }

    async function startAudioExtraction() {
      hideStatus();
      if (!rawVideoFile) return;

      const startTime = performance.now();

      const btn = document.getElementById('extractBtn');
      const icon = document.getElementById('extractIcon');
      const text = document.getElementById('extractText');

      btn.disabled = true;
      icon.style.display = 'none';
      text.innerHTML = '<span class="spinner" style="margin-right: 6px;"></span>Extracting...';

      showProgress(10, 'Reading video stream...');

      const format = document.getElementById('targetFormat').value;
      outputExt = format;
      const bitrate = parseInt(document.getElementById('bitrateSelect').value, 10) || 192;
      const gainMult = (parseInt(document.getElementById('volumeGain').value, 10) || 100) / 100;
      const channelMode = document.getElementById('channelMode').value;

      try {
        const arrayBuffer = await rawVideoFile.arrayBuffer();
        showProgress(35, 'Decoding audio channels...');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        const startSec = parseFloat(document.getElementById('trimStart').value) || 0;
        const endSec = parseFloat(document.getElementById('trimEnd').value) || decodedBuffer.duration;

        const sampleRate = decodedBuffer.sampleRate;
        const srcChan = decodedBuffer.numberOfChannels;
        const outChan = channelMode === 'mono' ? 1 : srcChan;

        const startSample = Math.floor(startSec * sampleRate);
        const endSample = Math.min(decodedBuffer.length, Math.floor(endSec * sampleRate));
        const frameCount = Math.max(1, endSample - startSample);

        // Extract float channels
        const leftChannel = new Float32Array(frameCount);
        const rightChannel = outChan === 2 ? new Float32Array(frameCount) : leftChannel;

        const srcLeft = decodedBuffer.getChannelData(0);
        const srcRight = srcChan > 1 ? decodedBuffer.getChannelData(1) : srcLeft;

        for (let i = 0; i < frameCount; i++) {
          leftChannel[i] = srcLeft[startSample + i] * gainMult;
          if (outChan === 2) {
            rightChannel[i] = srcRight[startSample + i] * gainMult;
          }
        }

        if (format === 'mp3') {
          showProgress(50, 'Scaling multi-threaded CPU workers...');
          // Parallel Web Worker Thread Pool Encoding
          extractedAudioBlob = await encodeMp3Parallel(leftChannel, rightChannel, sampleRate, outChan, bitrate);
        } else {
          showProgress(85, 'Exporting uncompressed PCM WAV...');
          // Instant WAV PCM Encoding
          extractedAudioBlob = bufferToWaveFast(leftChannel, rightChannel, sampleRate, outChan);
        }

        const elapsedSec = ((performance.now() - startTime) / 1000).toFixed(2);
        showProgress(100, `Done in ${elapsedSec}s!`);

        if (extractedAudioUrl) URL.revokeObjectURL(extractedAudioUrl);
        extractedAudioUrl = URL.createObjectURL(extractedAudioBlob);

        const aPlayer = document.getElementById('audioPlayer');
        aPlayer.src = extractedAudioUrl;
        aPlayer.style.display = 'block';
        document.getElementById('noAudioText').style.display = 'none';

        document.getElementById('audioMediaInfo').innerHTML = `
          <strong>Format:</strong> ${format.toUpperCase()} | <strong>Size:</strong> ${formatFileSize(extractedAudioBlob.size)} | <strong>Time:</strong> ${elapsedSec}s
        `;

        document.getElementById('downloadBtn').disabled = false;
        showStatus(`Extracted audio track in ${elapsedSec}s (${formatFileSize(extractedAudioBlob.size)}).`, 'success');
      } catch (err) {
        showStatus('Audio Extraction error: ' + err.message, 'error');
      }

      hideProgress();
      btn.disabled = false;
      icon.style.display = 'block';
      text.innerHTML = 'Fast Extract Audio';
    }

    /* Parallel Web Worker MP3 Encoder */
    async function encodeMp3Parallel(left, right, sampleRate, numChannels, kbps) {
      const numWorkers = Math.min(8, Math.max(2, navigator.hardwareConcurrency || 4));
      const totalSamples = left.length;
      const chunkSize = Math.ceil(totalSamples / numWorkers);

      const workerCode = `
        importScripts('https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.all.min.js');

        self.onmessage = function(e) {
          const { left, right, sampleRate, numChannels, kbps, chunkIndex } = e.data;
          const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, kbps);
          const mp3Data = [];
          const sampleBlockSize = 1152;
          const total = left.length;

          const leftInt16 = new Int16Array(total);
          const rightInt16 = new Int16Array(total);

          for (let i = 0; i < total; i++) {
            let l = Math.max(-1, Math.min(1, left[i]));
            let r = Math.max(-1, Math.min(1, right[i]));
            leftInt16[i] = l < 0 ? l * 32768 : l * 32767;
            rightInt16[i] = r < 0 ? r * 32768 : r * 32767;
          }

          for (let i = 0; i < total; i += sampleBlockSize) {
            const leftChunk = leftInt16.subarray(i, i + sampleBlockSize);
            const rightChunk = rightInt16.subarray(i, i + sampleBlockSize);

            let mp3buf = null;
            if (numChannels === 2) {
              mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
            } else {
              mp3buf = mp3encoder.encodeBuffer(leftChunk);
            }
            if (mp3buf.length > 0) mp3Data.push(mp3buf);
          }

          const mp3buf = mp3encoder.flush();
          if (mp3buf.length > 0) mp3Data.push(mp3buf);

          self.postMessage({ chunkIndex, mp3Data });
        };
      `;

      const blob = new Blob([workerCode], { type: 'application/javascript' });
      const workerUrl = URL.createObjectURL(blob);

      const tasks = [];
      let completedWorkers = 0;

      for (let w = 0; w < numWorkers; w++) {
        const start = w * chunkSize;
        const end = Math.min(totalSamples, start + chunkSize);
        if (start >= totalSamples) break;

        // Slice independent Float32Array copies to prevent detached ArrayBuffer errors
        const subLeft = left.slice(start, end);
        const subRight = numChannels === 2 ? right.slice(start, end) : subLeft;

        tasks.push(new Promise((resolve, reject) => {
          const worker = new Worker(workerUrl);
          worker.onmessage = function(e) {
            completedWorkers++;
            showProgress(50 + Math.round((completedWorkers / numWorkers) * 45), `Parallel CPU encoding (${completedWorkers}/${numWorkers} workers)...`);
            worker.terminate();
            resolve(e.data);
          };
          worker.onerror = function(err) {
            worker.terminate();
            reject(err);
          };
          worker.postMessage({
            left: subLeft,
            right: subRight,
            sampleRate,
            numChannels,
            kbps,
            chunkIndex: w
          }, [subLeft.buffer, subRight.buffer]);
        }));
      }

      const results = await Promise.all(tasks);
      URL.revokeObjectURL(workerUrl);

      results.sort((a, b) => a.chunkIndex - b.chunkIndex);

      const combinedMp3Data = [];
      for (let r of results) {
        combinedMp3Data.push(...r.mp3Data);
      }

      return new Blob(combinedMp3Data, { type: 'audio/mp3' });
    }

    /* Fast WAV PCM Encoder */
    function bufferToWaveFast(left, right, sampleRate, numOfChan) {
      const len = left.length;
      const length = len * numOfChan * 2 + 44;
      const buffer = new ArrayBuffer(length);
      const view = new DataView(buffer);
      let pos = 0;

      function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); // "RIFF"
      setUint32(length - 8);
      setUint32(0x45564157); // "WAVE"

      setUint32(0x20746d66); // "fmt "
      setUint32(16);
      setUint16(1);
      setUint16(numOfChan);
      setUint32(sampleRate);
      setUint32(sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);

      setUint32(0x61746164); // "data"
      setUint32(length - pos - 4);

      for (let i = 0; i < len; i++) {
        let l = Math.max(-1, Math.min(1, left[i]));
        view.setInt16(pos, l < 0 ? l * 32768 : l * 32767, true);
        pos += 2;

        if (numOfChan === 2) {
          let r = Math.max(-1, Math.min(1, right[i]));
          view.setInt16(pos, r < 0 ? r * 32768 : r * 32767, true);
          pos += 2;
        }
      }

      return new Blob([buffer], { type: "audio/wav" });
    }

    function downloadExtractedAudio() {
      if (!extractedAudioBlob || !extractedAudioUrl) return;

      const baseName = rawVideoFile.name.substring(0, rawVideoFile.name.lastIndexOf('.')) || 'extracted_audio';
      const a = document.createElement('a');
      a.href = extractedAudioUrl;
      a.download = `${baseName}.${outputExt}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      triggerSuccessButton('downloadBtn', 'downloadIcon', 'downloadText', `Saved ${outputExt.toUpperCase()} Audio!`);
    }

    function showProgress(pct, text) {
      const container = document.getElementById('progressContainer');
      container.style.display = 'flex';
      document.getElementById('progressText').textContent = text;
      document.getElementById('progressPct').textContent = `${pct}%`;
      document.getElementById('progressBarFill').style.width = `${pct}%`;
    }

    function hideProgress() {
      document.getElementById('progressContainer').style.display = 'none';
    }

    function triggerSuccessButton(btnId, iconId, textId, successText) {
      const btn = document.getElementById(btnId);
      const icon = document.getElementById(iconId);
      const text = document.getElementById(textId);

      const originalText = text.innerText;
      const originalIcon = icon.innerText;

      btn.classList.add('btn-success');
      icon.innerText = 'check';
      text.innerText = successText;

      setTimeout(() => {
        btn.classList.remove('btn-success');
        icon.innerText = originalIcon;
        text.innerText = originalText;
      }, 2000);
    }

    function clearAll() {
      if (videoObjectUrl) {
        URL.revokeObjectURL(videoObjectUrl);
        videoObjectUrl = null;
      }
      if (extractedAudioUrl) {
        URL.revokeObjectURL(extractedAudioUrl);
        extractedAudioUrl = null;
      }
      rawVideoFile = null;
      extractedAudioBlob = null;

      document.getElementById('fileInput').value = '';
      document.getElementById('videoPlayer').style.display = 'none';
      document.getElementById('audioPlayer').style.display = 'none';
      document.getElementById('noVideoText').style.display = 'block';
      document.getElementById('noAudioText').style.display = 'block';
      document.getElementById('videoMediaInfo').innerHTML = '';
      document.getElementById('audioMediaInfo').innerHTML = '';
      document.getElementById('extractBtn').disabled = true;
      document.getElementById('downloadBtn').disabled = true;
      document.getElementById('dropZoneText').textContent = 'Click or drag & drop video files here (MP4, WebM, MOV, AVI, MKV)';

      hideStatus();
      hideProgress();

      dropZone.classList.remove('flash-clear');
      document.getElementById('controlsPanel').classList.remove('flash-clear');

      void dropZone.offsetWidth;

      dropZone.classList.add('flash-clear');
      document.getElementById('controlsPanel').classList.add('flash-clear');
    }

    function showStatus(msg, type) {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = `status-box ${type}`;
      statusBox.textContent = msg;
    }

    function hideStatus() {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = 'status-box';
      statusBox.textContent = '';
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return '00:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 10);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${ms}`;
    }

    function formatFileSize(bytes) {
      if (!bytes) return '0 B';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }
  </script>
</body>
