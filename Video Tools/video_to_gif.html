<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Video to GIF Converter</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500&family=Roboto:wght@400;500&family=Roboto+Mono&display=swap"
    rel="stylesheet">
  <!-- Google Material Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,0,0" />
  <!-- gif.js multi-threaded encoder -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

  <style>
    :root {
      --bg-color: #f8f9fa;
      --border-color: #dadce0;
      --primary-blue: #1a73e8;
      --primary-hover: #174ea6;
      --success-bg: #e6f4ea;
      --success-text: #137333;
      --danger-bg: #fce8e6;
      --danger-text: #c5221f;
      --text-main: #202124;
      --text-secondary: #5f6368;
    }

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #ffffff;
      color: var(--text-main);
      box-sizing: border-box;
    }

    h2,
    .btn {
      font-family: 'Google Sans', sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    /* Drop Zone */
    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      background-color: var(--bg-color);
      cursor: pointer;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: var(--primary-blue);
      background-color: #e8f0fe;
    }

    .drop-zone p {
      margin: 8px 0 0 0;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .file-input {
      display: none;
    }

    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: var(--bg-color);
      padding: 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 110px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
    }

    select,
    input[type="number"],
    input[type="text"] {
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: #ffffff;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.3s ease;
    }

    select:focus,
    input[type="number"]:focus,
    input[type="text"]:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 1px var(--primary-blue);
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--primary-blue);
    }

    /* Media Box */
    .media-box {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      background-color: #202124;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    video,
    .gif-preview-img {
      max-width: 100%;
      max-height: 280px;
      border-radius: 4px;
    }

    .image-info {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.4;
      margin-top: 4px;
    }

    /* Progress Container */
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background-color: var(--border-color);
      border-radius: 3px;
      overflow: hidden;
      display: none;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--primary-blue);
      transition: width 0.15s ease;
    }

    /* Animation class for Clear */
    .flash-clear {
      animation: clearPulse 0.4s ease-out;
    }

    @keyframes clearPulse {
      0% {
        background-color: var(--bg-color);
      }

      50% {
        background-color: #e8eaed;
      }

      100% {
        background-color: var(--bg-color);
      }
    }

    /* Status Box */
    .status-box {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 6px;
      display: none;
    }

    .status-box.error {
      display: block;
      background-color: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid #f5c6cb;
    }

    .status-box.success {
      display: block;
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid #c3e6cb;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      font-family: 'Google Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: scale(1);
    }

    .material-symbols-outlined {
      font-size: 18px;
    }

    .btn-primary {
      background-color: var(--primary-blue);
      color: white;
      min-width: 170px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
      box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
    }

    .btn-secondary {
      background-color: white;
      color: var(--primary-blue);
      border-color: var(--border-color);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #f8f9fa;
      border-color: #dadce0;
    }

    .btn-success,
    .btn-success:hover {
      background-color: var(--success-bg) !important;
      color: var(--success-text) !important;
      border-color: var(--success-bg) !important;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  
    /* Header Bar: Feedback & Creator Chips */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .action-chip {
      font-family: 'Google Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background-color: #ffffff;
      color: var(--text-secondary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-sizing: border-box;
      line-height: 1;
    }

    .action-chip .material-symbols-outlined {
      font-size: 15px;
    }

    .action-chip:hover {
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.2);
      transform: translateY(-1px);
    }

    .action-chip:active {
      transform: scale(0.95);
    }

    .chip-bug:hover {
      background-color: var(--danger-bg);
      color: var(--danger-text);
      border-color: #f5c6cb;
    }

    .chip-feature:hover {
      background-color: #fef7e0;
      color: #b06000;
      border-color: #f9ab00;
    }

    .chip-creator:hover {
      background-color: #e8f0fe;
      color: var(--primary-blue);
      border-color: #aecbfa;
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- Header Bar: Feedback & Creator Chips -->
    <div class="header-bar">
      <div class="header-actions">
        <a href="mailto:hikapil@google.com?cc=useful-tools@google.com&amp;subject=%5BUser%20Feedback%5D%20%7C%20Bug%20Found%20on%20go%2Fusefultools&amp;body=Hi%20Kapil%2C%0A%0AI%E2%80%99m%20reaching%20out%20to%20report%20a%20bug.%20Here%20are%20the%20relevant%20details%3A%0A%0ABug%20Description%3A%20%5BPlease%20provide%20a%20description%20of%20the%20issue%20here%5D%0ABug%20Screenshot%20(optional)%3A%20%5BPlease%20include%20the%20screenshot%20with%20this%20email%5D"
          target="_blank" rel="noopener noreferrer" class="action-chip chip-bug" title="Report a Bug">
          <span class="material-symbols-outlined">bug_report</span>

        </a>

          target="_blank" rel="noopener noreferrer" class="action-chip chip-feature" title="Request a New Feature">
          <span class="material-symbols-outlined">lightbulb</span>
          <span>Request Feature</span>
        </a>
    
        <a href="https://moma.corp.google.com/person/hikapil" target="_blank" rel="noopener noreferrer"
          class="action-chip chip-creator" title="Meet the Creator on Moma">
          <span class="material-symbols-outlined">person</span>
          <span>Meet the Creator</span>
        </a>
      </div>
    </div>
    <!-- Drop Zone -->
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <span class="material-symbols-outlined" style="font-size: 36px; color: var(--primary-blue);">bolt</span>
      <p id="dropZoneText">Click or drag & drop a video file here (Ultra-Fast Parallel GIF Encoder)</p>
      <input type="file" id="fileInput" class="file-input" accept="video/*" onchange="handleFileSelect(event)">
    </div>

    <div class="grid">
      <!-- Media View & Trim Column -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="font-weight: 500;">Source Video Player</label>
        <div class="media-box">
          <span id="noVideoText" style="color: #9aa0a6; font-size: 13px;">Upload a video to start</span>
          <video id="videoPlayer" controls style="display: none;"></video>
        </div>

        <!-- Trim Controls -->
        <div class="controls-panel" id="trimControls" style="display: none;">
          <div class="control-row">
            <div class="input-group">
              <label for="startTime">Start Time (sec)</label>
              <input type="number" id="startTime" min="0" step="0.1" value="0" oninput="validateTrim()">
            </div>
            <button class="btn-secondary" style="padding: 4px 8px; font-size: 11px; margin-top: 18px;" onclick="setStartToCurrent()">Set Start</button>

            <div class="input-group">
              <label for="endTime">End Time (sec)</label>
              <input type="number" id="endTime" min="0.1" step="0.1" value="5" oninput="validateTrim()">
            </div>
            <button class="btn-secondary" style="padding: 4px 8px; font-size: 11px; margin-top: 18px;" onclick="setEndToCurrent()">Set End</button>
          </div>
        </div>
      </div>

      <!-- GIF Settings Column -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="font-weight: 500;">GIF Result & Advanced Options</label>

        <!-- Controls Options -->
        <div class="controls-panel" id="controlsPanel">
          <div class="control-row">
            <div class="input-group">
              <label for="targetWidth">GIF Width (px)</label>
              <select id="targetWidth">
                <option value="360" selected>360px (Standard)</option>
                <option value="480">480px (Medium HD)</option>
                <option value="640">640px (HD)</option>
                <option value="240">240px (Small)</option>
              </select>
            </div>

            <div class="input-group">
              <label for="targetFps">Frame Rate (FPS)</label>
              <select id="targetFps">
                <option value="12" selected>12 FPS (Fast & Smooth)</option>
                <option value="15">15 FPS (Smooth)</option>
                <option value="20">20 FPS (High Motion)</option>
                <option value="8">8 FPS (Ultra Small)</option>
              </select>
            </div>
          </div>

          <div class="control-row">
            <div class="input-group">
              <label for="playSpeed">Playback Speed</label>
              <select id="playSpeed">
                <option value="1.0" selected>1.0x (Normal)</option>
                <option value="0.5">0.5x (Slow Motion)</option>
                <option value="1.5">1.5x (Fast)</option>
                <option value="2.0">2.0x (Timelapse)</option>
              </select>
            </div>

            <div class="input-group">
              <label for="loopMode">Loop Direction</label>
              <select id="loopMode">
                <option value="normal" selected>Normal Loop</option>
                <option value="reverse">Reverse GIF</option>
                <option value="boomerang">Boomerang (Forward + Reverse)</option>
              </select>
            </div>
          </div>

          <div class="control-row">
            <div class="input-group">
              <label for="topText">Overlay Top Caption</label>
              <input type="text" id="topText" placeholder="Top Meme / Title Text">
            </div>

            <div class="input-group">
              <label for="bottomText">Overlay Bottom Caption</label>
              <input type="text" id="bottomText" placeholder="Bottom Caption Text">
            </div>
          </div>
        </div>

        <!-- GIF Preview Container -->
        <div class="media-box" style="background-color: var(--bg-color);">
          <span id="noGifText" style="color: var(--text-secondary); font-size: 13px;">Converted GIF preview will appear here</span>
          <img id="gifPreview" class="gif-preview-img" style="display: none;" alt="GIF Preview">
        </div>
        <div id="imageInfo" class="image-info"></div>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar-container" id="progressContainer">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>

    <!-- Status Box -->
    <div id="statusBox" class="status-box"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button id="convertBtn" class="btn-primary" onclick="convertVideoToGifFast()" disabled>
        <span class="material-symbols-outlined" id="convertIcon">bolt</span>
        <span id="convertText">Fast Convert to GIF</span>
      </button>

      <button id="downloadBtn" class="btn-secondary" onclick="downloadGif()" disabled>
        <span class="material-symbols-outlined" id="downloadIcon">download</span>
        <span id="downloadText">Download GIF</span>
      </button>

      <button class="btn-secondary" onclick="clearAll()" style="color: var(--text-secondary);">
        <span class="material-symbols-outlined">delete</span>
        Clear
      </button>
    </div>
  </div>

  <script>
    let rawVideoFile = null;
    let videoObjectUrl = null;
    let generatedGifBlob = null;
    let generatedGifUrl = null;
    let workerScriptUrl = null;

    const dropZone = document.getElementById('dropZone');

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('video/'));
      if (files.length > 0) loadVideo(files[0]);
    });

    function handleFileSelect(event) {
      if (event.target.files.length > 0) {
        loadVideo(event.target.files[0]);
      }
    }

    async function loadVideo(file) {
      hideStatus();
      rawVideoFile = file;

      if (videoObjectUrl) URL.revokeObjectURL(videoObjectUrl);
      videoObjectUrl = URL.createObjectURL(file);

      const video = document.getElementById('videoPlayer');
      video.src = videoObjectUrl;
      video.style.display = 'block';
      document.getElementById('noVideoText').style.display = 'none';

      video.onloadedmetadata = () => {
        const duration = video.duration;
        document.getElementById('startTime').value = 0;
        document.getElementById('endTime').value = Math.min(10, Math.round(duration * 10) / 10);
        document.getElementById('trimControls').style.display = 'flex';
        document.getElementById('convertBtn').disabled = false;
        document.getElementById('dropZoneText').textContent = `Loaded: ${file.name} (${Math.round(duration)}s, ${formatFileSize(file.size)})`;
      };

      // Pre-fetch gif.js worker for multi-threading
      if (!workerScriptUrl) {
        try {
          const resp = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
          const blob = await resp.blob();
          workerScriptUrl = URL.createObjectURL(blob);
        } catch (e) {
          workerScriptUrl = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
        }
      }
    }

    function setStartToCurrent() {
      const video = document.getElementById('videoPlayer');
      document.getElementById('startTime').value = Math.round(video.currentTime * 10) / 10;
      validateTrim();
    }

    function setEndToCurrent() {
      const video = document.getElementById('videoPlayer');
      document.getElementById('endTime').value = Math.round(video.currentTime * 10) / 10;
      validateTrim();
    }

    function validateTrim() {
      const start = parseFloat(document.getElementById('startTime').value) || 0;
      const end = parseFloat(document.getElementById('endTime').value) || 0;

      if (end <= start) {
        showStatus('End time must be greater than start time.', 'error');
        document.getElementById('convertBtn').disabled = true;
      } else if (end - start > 60) {
        showStatus('GIF duration is limited to 60 seconds.', 'error');
        document.getElementById('convertBtn').disabled = true;
      } else {
        hideStatus();
        document.getElementById('convertBtn').disabled = false;
      }
    }

    async function convertVideoToGifFast() {
      hideStatus();
      if (!rawVideoFile || !videoObjectUrl) {
        showStatus('Please upload a video file first.', 'error');
        return;
      }

      const btn = document.getElementById('convertBtn');
      const icon = document.getElementById('convertIcon');
      const text = document.getElementById('convertText');
      const progressContainer = document.getElementById('progressContainer');
      const progressFill = document.getElementById('progressFill');

      btn.disabled = true;
      icon.style.display = 'none';
      text.innerHTML = '<span class="spinner" style="margin-right: 6px;"></span>Extracting Frames...';
      progressContainer.style.display = 'block';
      progressFill.style.width = '0%';

      const startTime = parseFloat(document.getElementById('startTime').value) || 0;
      const endTime = parseFloat(document.getElementById('endTime').value) || 5;
      const duration = Math.max(0.5, endTime - startTime);
      const width = parseInt(document.getElementById('targetWidth').value, 10);
      const fps = parseInt(document.getElementById('targetFps').value, 10);
      const speed = parseFloat(document.getElementById('playSpeed').value);
      const loopMode = document.getElementById('loopMode').value;
      const topText = document.getElementById('topText').value.trim();
      const bottomText = document.getElementById('bottomText').value.trim();

      const video = document.getElementById('videoPlayer');
      const aspect = video.videoWidth > 0 ? (video.videoHeight / video.videoWidth) : 0.75;
      const height = Math.round(width * aspect);

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      const gif = new GIF({
        workers: 4,
        quality: 10,
        width: width,
        height: height,
        workerScript: workerScriptUrl || 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'
      });

      const totalFrames = Math.round(duration * fps);
      const frameInterval = (1 / fps) * speed;
      const capturedFrames = [];

      // Fast frame extraction loop
      video.pause();

      for (let i = 0; i < totalFrames; i++) {
        const timePos = startTime + (i * frameInterval);
        if (timePos > video.duration) break;

        video.currentTime = timePos;
        await new Promise(res => { video.onseeked = res; });

        ctx.drawImage(video, 0, 0, width, height);

        // Draw meme text overlay if present
        if (topText || bottomText) {
          ctx.font = `bold ${Math.max(14, Math.round(width * 0.08))}px Impact, Arial, sans-serif`;
          ctx.fillStyle = '#FFFFFF';
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = Math.max(2, Math.round(width * 0.015));
          ctx.textAlign = 'center';

          if (topText) {
            ctx.strokeText(topText.toUpperCase(), width / 2, Math.round(height * 0.15));
            ctx.fillText(topText.toUpperCase(), width / 2, Math.round(height * 0.15));
          }
          if (bottomText) {
            ctx.strokeText(bottomText.toUpperCase(), width / 2, Math.round(height * 0.9));
            ctx.fillText(bottomText.toUpperCase(), width / 2, Math.round(height * 0.9));
          }
        }

        const frameData = ctx.getImageData(0, 0, width, height);
        capturedFrames.push(frameData);

        const pct = Math.round(((i + 1) / totalFrames) * 40); // 0-40% for extraction
        progressFill.style.width = `${pct}%`;
      }

      text.innerHTML = '<span class="spinner" style="margin-right: 6px;"></span>Encoding GIF (Parallel)...';

      // Loop direction assembly
      let finalSequence = [...capturedFrames];
      if (loopMode === 'reverse') {
        finalSequence.reverse();
      } else if (loopMode === 'boomerang') {
        const reversed = [...capturedFrames].reverse();
        finalSequence = capturedFrames.concat(reversed);
      }

      const frameDelay = Math.round((1000 / fps) / speed);

      finalSequence.forEach(frameData => {
        ctx.putImageData(frameData, 0, 0);
        gif.addFrame(ctx, { copy: true, delay: frameDelay });
      });

      gif.on('progress', function (p) {
        const pct = 40 + Math.round(p * 60); // 40-100% for encoding
        progressFill.style.width = `${pct}%`;
      });

      gif.on('finished', function (blob) {
        generatedGifBlob = blob;
        if (generatedGifUrl) URL.revokeObjectURL(generatedGifUrl);
        generatedGifUrl = URL.createObjectURL(blob);

        const gifPreview = document.getElementById('gifPreview');
        gifPreview.src = generatedGifUrl;
        gifPreview.style.display = 'block';
        document.getElementById('noGifText').style.display = 'none';

        document.getElementById('imageInfo').innerHTML = `
          <strong>Dimensions:</strong> ${width} × ${height} px | <strong>Frames:</strong> ${finalSequence.length} | <strong>GIF Size:</strong> ${formatFileSize(blob.size)}
        `;

        document.getElementById('downloadBtn').disabled = false;
        btn.disabled = false;
        icon.style.display = 'block';
        text.innerHTML = 'Fast Convert to GIF';
        showStatus(`Ultra-fast conversion complete in seconds (${formatFileSize(blob.size)})!`, 'success');
        setTimeout(() => { progressContainer.style.display = 'none'; }, 500);
      });

      gif.render();
    }

    function downloadGif() {
      if (!generatedGifBlob || !generatedGifUrl) return;

      const baseName = rawVideoFile.name.substring(0, rawVideoFile.name.lastIndexOf('.')) || 'video';
      const a = document.createElement('a');
      a.href = generatedGifUrl;
      a.download = `${baseName}_fast.gif`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      triggerSuccessButton('downloadBtn', 'downloadIcon', 'downloadText', 'Saved GIF!');
    }

    function triggerSuccessButton(btnId, iconId, textId, successText) {
      const btn = document.getElementById(btnId);
      const icon = document.getElementById(iconId);
      const text = document.getElementById(textId);

      const originalText = text.innerText;
      const originalIcon = icon.innerText;

      btn.classList.add('btn-success');
      icon.innerText = 'check';
      text.innerText = successText;

      setTimeout(() => {
        btn.classList.remove('btn-success');
        icon.innerText = originalIcon;
        text.innerText = originalText;
      }, 2000);
    }

    function clearAll() {
      if (videoObjectUrl) {
        URL.revokeObjectURL(videoObjectUrl);
        videoObjectUrl = null;
      }
      if (generatedGifUrl) {
        URL.revokeObjectURL(generatedGifUrl);
        generatedGifUrl = null;
      }
      rawVideoFile = null;
      generatedGifBlob = null;

      document.getElementById('fileInput').value = '';
      document.getElementById('videoPlayer').style.display = 'none';
      document.getElementById('noVideoText').style.display = 'block';
      document.getElementById('gifPreview').style.display = 'none';
      document.getElementById('noGifText').style.display = 'block';
      document.getElementById('trimControls').style.display = 'none';
      document.getElementById('imageInfo').innerHTML = '';
      document.getElementById('topText').value = '';
      document.getElementById('bottomText').value = '';
      document.getElementById('convertBtn').disabled = true;
      document.getElementById('downloadBtn').disabled = true;
      document.getElementById('dropZoneText').textContent = 'Click or drag & drop a video file here (Ultra-Fast Parallel GIF Encoder)';

      hideStatus();

      dropZone.classList.remove('flash-clear');
      document.getElementById('controlsPanel').classList.remove('flash-clear');

      void dropZone.offsetWidth;

      dropZone.classList.add('flash-clear');
      document.getElementById('controlsPanel').classList.add('flash-clear');
    }

    function showStatus(msg, type) {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = `status-box ${type}`;
      statusBox.textContent = msg;
    }

    function hideStatus() {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = 'status-box';
      statusBox.textContent = '';
    }

    function formatFileSize(bytes) {
      if (!bytes) return '0 B';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }
  </script>
</body>

</html>
