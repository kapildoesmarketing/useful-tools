<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Trimmer & Frame Extractor</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500&family=Roboto:wght@400;500&family=Roboto+Mono&display=swap"
    rel="stylesheet">
  <!-- Google Material Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,0,0" />
  <!-- JSZip library for frame zip exports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-color: #f8f9fa;
      --border-color: #dadce0;
      --primary-blue: #1a73e8;
      --primary-hover: #174ea6;
      --success-bg: #e6f4ea;
      --success-text: #137333;
      --danger-bg: #fce8e6;
      --danger-text: #c5221f;
      --text-main: #202124;
      --text-secondary: #5f6368;
    }

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #ffffff;
      color: var(--text-main);
      box-sizing: border-box;
    }

    h2,
    .btn {
      font-family: 'Google Sans', sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    /* Drop Zone */
    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      background-color: var(--bg-color);
      cursor: pointer;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: var(--primary-blue);
      background-color: #e8f0fe;
    }

    .drop-zone p {
      margin: 8px 0 0 0;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .file-input {
      display: none;
    }

    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: var(--bg-color);
      padding: 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 110px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
    }

    select,
    input[type="number"] {
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: #ffffff;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.3s ease;
    }

    select:focus,
    input[type="number"]:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 1px var(--primary-blue);
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--primary-blue);
    }

    /* Video Player Box */
    .media-box {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      background-color: #202124;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    video {
      max-width: 100%;
      max-height: 320px;
      border-radius: 4px;
    }

    .media-info {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Extracted Frames Grid */
    .frames-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .frames-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .frames-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
      padding: 2px;
    }

    .frame-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px;
      position: relative;
    }

    .frame-card img {
      max-width: 100%;
      height: 70px;
      object-fit: contain;
      border-radius: 4px;
      background-color: #ffffff;
    }

    .frame-tag {
      font-size: 10px;
      font-family: 'Roboto Mono', monospace;
      color: var(--text-secondary);
    }

    /* Progress Container */
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background-color: var(--border-color);
      border-radius: 3px;
      overflow: hidden;
      display: none;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--primary-blue);
      transition: width 0.15s ease;
    }

    /* Animation class for Clear */
    .flash-clear {
      animation: clearPulse 0.4s ease-out;
    }

    @keyframes clearPulse {
      0% {
        background-color: var(--bg-color);
      }

      50% {
        background-color: #e8eaed;
      }

      100% {
        background-color: var(--bg-color);
      }
    }

    /* Status Box */
    .status-box {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 6px;
      display: none;
    }

    .status-box.error {
      display: block;
      background-color: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid #f5c6cb;
    }

    .status-box.success {
      display: block;
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid #c3e6cb;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      font-family: 'Google Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: scale(1);
    }

    .material-symbols-outlined {
      font-size: 18px;
    }

    .btn-primary {
      background-color: var(--primary-blue);
      color: white;
      min-width: 160px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
      box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
    }

    .btn-secondary {
      background-color: white;
      color: var(--primary-blue);
      border-color: var(--border-color);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #f8f9fa;
      border-color: #dadce0;
    }

    .btn-success,
    .btn-success:hover {
      background-color: var(--success-bg) !important;
      color: var(--success-text) !important;
      border-color: var(--success-bg) !important;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- Drop Zone -->
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <span class="material-symbols-outlined" style="font-size: 36px; color: var(--primary-blue);">content_cut</span>
      <p id="dropZoneText">Click or drag & drop a video file here (MP4, WebM, MOV, AVI, OGG)</p>
      <input type="file" id="fileInput" class="file-input" accept="video/*" onchange="handleFileSelect(event)">
    </div>

    <div class="grid">
      <!-- Video Player & Trim Settings -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="font-weight: 500;">Interactive Video Player & Scrubber</label>
        <div class="media-box">
          <span id="noVideoText" style="color: #9aa0a6; font-size: 13px;">Upload a video to start</span>
          <video id="videoPlayer" controls style="display: none;" ontimeupdate="onTimeUpdate()"></video>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div id="mediaInfo" class="media-info"></div>
          <button id="extractFrameBtn" class="btn-primary" style="padding: 4px 12px; font-size: 12px; min-width: 120px;" onclick="extractCurrentFrame()" disabled>
            <span class="material-symbols-outlined" style="font-size: 16px;">photo_camera</span> Extract Frame
          </button>
        </div>

        <!-- Trim Controls -->
        <div class="controls-panel" id="trimControls" style="display: none;">
          <div class="control-row">
            <div class="input-group">
              <label for="startTime">Trim Start (sec)</label>
              <input type="number" id="startTime" min="0" step="0.1" value="0" oninput="updateTrimRange()">
            </div>
            <button class="btn-secondary" style="padding: 4px 8px; font-size: 11px; margin-top: 18px;" onclick="setStartToCurrent()">Set Start</button>

            <div class="input-group">
              <label for="endTime">Trim End (sec)</label>
              <input type="number" id="endTime" min="0.1" step="0.1" value="5" oninput="updateTrimRange()">
            </div>
            <button class="btn-secondary" style="padding: 4px 8px; font-size: 11px; margin-top: 18px;" onclick="setEndToCurrent()">Set End</button>
          </div>

          <div class="control-row">
            <div class="input-group">
              <label for="playbackRate">Playback Speed</label>
              <select id="playbackRate" onchange="document.getElementById('videoPlayer').playbackRate = parseFloat(this.value)">
                <option value="0.25">0.25x (Slow)</option>
                <option value="0.5">0.5x</option>
                <option value="1.0" selected>1.0x (Normal)</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2.0">2.0x (Fast)</option>
              </select>
            </div>

            <div class="input-group">
              <label for="frameFormat">Frame Export Format</label>
              <select id="frameFormat">
                <option value="image/png" selected>PNG (Lossless)</option>
                <option value="image/jpeg">JPEG (.jpg)</option>
                <option value="image/webp">WebP (.webp)</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Extracted Frames Panel -->
      <div class="frames-container">
        <div class="frames-header">
          <label style="font-weight: 500;">Extracted Video Frames</label>
          <button id="downloadZipBtn" class="btn-secondary" style="padding: 2px 8px; font-size: 11px;" onclick="downloadAllFramesZip()" disabled>
            <span class="material-symbols-outlined" style="font-size: 14px;">folder_zip</span> Save All ZIP
          </button>
        </div>

        <div id="framesGrid" class="frames-grid">
          <div style="font-size: 13px; color: var(--text-secondary); text-align: center; padding: 32px; grid-column: 1 / -1;">
            Click <strong>Extract Frame</strong> while playing or pausing video to capture high-res snapshots...
          </div>
        </div>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar-container" id="progressContainer">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>

    <!-- Status Box -->
    <div id="statusBox" class="status-box"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button id="trimBtn" class="btn-primary" onclick="startTrimmingVideo()" disabled>
        <span class="material-symbols-outlined" id="trimIcon">content_cut</span>
        <span id="trimText">Export Trimmed Video</span>
      </button>

      <button id="downloadVideoBtn" class="btn-secondary" onclick="downloadTrimmedVideo()" disabled>
        <span class="material-symbols-outlined" id="downloadIcon">download</span>
        <span id="downloadText">Download Video</span>
      </button>

      <button class="btn-secondary" onclick="clearAll()" style="color: var(--text-secondary);">
        <span class="material-symbols-outlined">delete</span>
        Clear
      </button>
    </div>
  </div>

  <script>
    let rawVideoFile = null;
    let videoObjectUrl = null;
    let extractedFrames = []; // Array of { blob, dataUrl, timestamp, fileName }
    let trimmedVideoBlob = null;
    let trimmedVideoUrl = null;

    const dropZone = document.getElementById('dropZone');

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('video/'));
      if (files.length > 0) loadVideo(files[0]);
    });

    function handleFileSelect(event) {
      if (event.target.files.length > 0) {
        loadVideo(event.target.files[0]);
      }
    }

    function loadVideo(file) {
      hideStatus();
      rawVideoFile = file;

      if (videoObjectUrl) URL.revokeObjectURL(videoObjectUrl);
      videoObjectUrl = URL.createObjectURL(file);

      const video = document.getElementById('videoPlayer');
      video.src = videoObjectUrl;
      video.style.display = 'block';
      document.getElementById('noVideoText').style.display = 'none';

      video.onloadedmetadata = () => {
        const duration = video.duration;
        document.getElementById('startTime').value = 0;
        document.getElementById('endTime').value = Math.round(duration * 10) / 10;
        document.getElementById('trimControls').style.display = 'flex';
        document.getElementById('extractFrameBtn').disabled = false;
        document.getElementById('trimBtn').disabled = false;
        document.getElementById('dropZoneText').textContent = `Loaded: ${file.name} (${Math.round(duration)}s, ${formatFileSize(file.size)})`;

        updateMediaInfo();
      };
    }

    function updateMediaInfo() {
      const video = document.getElementById('videoPlayer');
      document.getElementById('mediaInfo').innerHTML = `
        <strong>Resolution:</strong> ${video.videoWidth} × ${video.videoHeight} | <strong>Duration:</strong> ${formatTime(video.duration)} | <strong>Current:</strong> ${formatTime(video.currentTime)}
      `;
    }

    function onTimeUpdate() {
      updateMediaInfo();
    }

    function setStartToCurrent() {
      const video = document.getElementById('videoPlayer');
      document.getElementById('startTime').value = Math.round(video.currentTime * 10) / 10;
      updateTrimRange();
    }

    function setEndToCurrent() {
      const video = document.getElementById('videoPlayer');
      document.getElementById('endTime').value = Math.round(video.currentTime * 10) / 10;
      updateTrimRange();
    }

    function updateTrimRange() {
      const start = parseFloat(document.getElementById('startTime').value) || 0;
      const end = parseFloat(document.getElementById('endTime').value) || 0;

      if (end <= start) {
        showStatus('Trim end time must be greater than start time.', 'error');
        document.getElementById('trimBtn').disabled = true;
      } else {
        hideStatus();
        document.getElementById('trimBtn').disabled = false;
      }
    }

    function extractCurrentFrame() {
      const video = document.getElementById('videoPlayer');
      if (!video || video.readyState < 2) return;

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const mimeType = document.getElementById('frameFormat').value;
      const ext = mimeType === 'image/jpeg' ? 'jpg' : mimeType === 'image/webp' ? 'webp' : 'png';
      const timeStr = formatTime(video.currentTime).replace(/:/g, '_');
      const baseName = rawVideoFile.name.substring(0, rawVideoFile.name.lastIndexOf('.')) || 'video';
      const fileName = `${baseName}_frame_${timeStr}.${ext}`;

      const dataUrl = canvas.toDataURL(mimeType, 0.95);
      canvas.toBlob((blob) => {
        extractedFrames.push({
          blob,
          dataUrl,
          timestamp: formatTime(video.currentTime),
          fileName
        });

        renderFramesGrid();
        document.getElementById('downloadZipBtn').disabled = false;
        showStatus(`Extracted frame at ${formatTime(video.currentTime)}.`, 'success');
      }, mimeType, 0.95);
    }

    function renderFramesGrid() {
      const grid = document.getElementById('framesGrid');
      if (extractedFrames.length === 0) {
        grid.innerHTML = `<div style="font-size: 13px; color: var(--text-secondary); text-align: center; padding: 32px; grid-column: 1 / -1;">Click <strong>Extract Frame</strong> while playing or pausing video to capture high-res snapshots...</div>`;
        return;
      }

      grid.innerHTML = extractedFrames.map((item, idx) => `
        <div class="frame-card">
          <img src="${item.dataUrl}" alt="${escapeHtml(item.fileName)}">
          <span class="frame-tag">@ ${item.timestamp}</span>
          <button class="btn-secondary" style="padding: 2px 6px; font-size: 10px;" onclick="downloadSingleFrame(${idx})">
            Save
          </button>
        </div>
      `).join('');
    }

    function downloadSingleFrame(idx) {
      const item = extractedFrames[idx];
      if (!item) return;

      const a = document.createElement('a');
      a.href = item.dataUrl;
      a.download = item.fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function downloadAllFramesZip() {
      if (extractedFrames.length === 0) return;

      const zip = new JSZip();
      extractedFrames.forEach(item => {
        zip.file(item.fileName, item.blob);
      });

      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(zipBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'extracted_video_frames.zip';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      triggerSuccessButton('downloadZipBtn', null, 'downloadZipBtn', 'Saved ZIP!');
    }

    async function startTrimmingVideo() {
      hideStatus();
      if (!rawVideoFile || !videoObjectUrl) return;

      const video = document.getElementById('videoPlayer');
      const start = parseFloat(document.getElementById('startTime').value) || 0;
      const end = parseFloat(document.getElementById('endTime').value) || video.duration;

      const btn = document.getElementById('trimBtn');
      const icon = document.getElementById('trimIcon');
      const text = document.getElementById('trimText');
      const progressContainer = document.getElementById('progressContainer');
      const progressFill = document.getElementById('progressFill');

      btn.disabled = true;
      icon.style.display = 'none';
      text.innerHTML = '<span class="spinner" style="margin-right: 6px;"></span>Trimming Video...';
      progressContainer.style.display = 'block';
      progressFill.style.width = '0%';

      try {
        const stream = video.captureStream ? video.captureStream() : video.mozCaptureStream();
        const mediaRecorder = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm' });

        const chunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

        mediaRecorder.onstop = () => {
          trimmedVideoBlob = new Blob(chunks, { type: 'video/webm' });
          if (trimmedVideoUrl) URL.revokeObjectURL(trimmedVideoUrl);
          trimmedVideoUrl = URL.createObjectURL(trimmedVideoBlob);

          document.getElementById('downloadVideoBtn').disabled = false;
          showStatus(`Trimmed video segment ready (${formatFileSize(trimmedVideoBlob.size)}).`, 'success');

          btn.disabled = false;
          icon.style.display = 'block';
          text.innerHTML = 'Export Trimmed Video';
          setTimeout(() => { progressContainer.style.display = 'none'; }, 500);
        };

        video.currentTime = start;
        video.muted = false;

        video.onseeked = () => {
          mediaRecorder.start();
          video.play();

          const duration = end - start;
          const interval = setInterval(() => {
            if (video.currentTime >= end || video.paused || video.ended) {
              clearInterval(interval);
              video.pause();
              mediaRecorder.stop();
            } else {
              const elapsed = video.currentTime - start;
              const pct = Math.min(100, Math.round((elapsed / duration) * 100));
              progressFill.style.width = `${pct}%`;
            }
          }, 100);
        };

      } catch (err) {
        showStatus('Error trimming video stream: ' + err.message, 'error');
        btn.disabled = false;
        icon.style.display = 'block';
        text.innerHTML = 'Export Trimmed Video';
        progressContainer.style.display = 'none';
      }
    }

    function downloadTrimmedVideo() {
      if (!trimmedVideoBlob || !trimmedVideoUrl) return;

      const baseName = rawVideoFile.name.substring(0, rawVideoFile.name.lastIndexOf('.')) || 'video';
      const a = document.createElement('a');
      a.href = trimmedVideoUrl;
      a.download = `${baseName}_trimmed.webm`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      triggerSuccessButton('downloadVideoBtn', 'downloadIcon', 'downloadText', 'Saved Video!');
    }

    function triggerSuccessButton(btnId, iconId, textId, successText) {
      const btn = document.getElementById(btnId);
      const icon = iconId ? document.getElementById(iconId) : null;
      const text = textId ? document.getElementById(textId) : null;

      const originalText = text ? text.innerText : btn.innerText;
      const originalIcon = icon ? icon.innerText : '';

      btn.classList.add('btn-success');
      if (icon) icon.innerText = 'check';
      if (text) text.innerText = successText;

      setTimeout(() => {
        btn.classList.remove('btn-success');
        if (icon) icon.innerText = originalIcon;
        if (text) text.innerText = originalText;
      }, 2000);
    }

    function clearAll() {
      if (videoObjectUrl) {
        URL.revokeObjectURL(videoObjectUrl);
        videoObjectUrl = null;
      }
      if (trimmedVideoUrl) {
        URL.revokeObjectURL(trimmedVideoUrl);
        trimmedVideoUrl = null;
      }
      rawVideoFile = null;
      extractedFrames = [];
      trimmedVideoBlob = null;

      document.getElementById('fileInput').value = '';
      document.getElementById('videoPlayer').style.display = 'none';
      document.getElementById('noVideoText').style.display = 'block';
      document.getElementById('trimControls').style.display = 'none';
      document.getElementById('mediaInfo').innerHTML = '';
      document.getElementById('extractFrameBtn').disabled = true;
      document.getElementById('trimBtn').disabled = true;
      document.getElementById('downloadVideoBtn').disabled = true;
      document.getElementById('downloadZipBtn').disabled = true;
      document.getElementById('dropZoneText').textContent = 'Click or drag & drop a video file here (MP4, WebM, MOV, AVI, OGG)';

      hideStatus();
      renderFramesGrid();

      dropZone.classList.remove('flash-clear');
      document.getElementById('controlsPanel').classList.remove('flash-clear');

      void dropZone.offsetWidth;

      dropZone.classList.add('flash-clear');
      document.getElementById('controlsPanel').classList.add('flash-clear');
    }

    function showStatus(msg, type) {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = `status-box ${type}`;
      statusBox.textContent = msg;
    }

    function hideStatus() {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = 'status-box';
      statusBox.textContent = '';
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return '00:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 10);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${ms}`;
    }

    function formatFileSize(bytes) {
      if (!bytes) return '0 B';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
