<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown File Creator & Documentation Studio</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <!-- Google Material Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,0,0" />
  <!-- Marked parser CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
  <!-- DOMPurify for safe rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
  <!-- Highlight.js for code syntax highlighting in preview -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #f8f9fa;
      --border-color: #dadce0;
      --primary-blue: #1a73e8;
      --primary-hover: #174ea6;
      --success-bg: #e6f4ea;
      --success-text: #137333;
      --danger-bg: #fce8e6;
      --danger-text: #c5221f;
      --text-main: #202124;
      --text-secondary: #5f6368;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #ffffff;
      color: var(--text-main);
    }

    h1, h2, h3, h4, .btn, .tab-btn {
      font-family: 'Google Sans', sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 100%;
      margin: 0 auto;
    }

    /* Standard Header Bar with Action Chips */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-title-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title-box h2 {
      margin: 0;
      font-size: 18px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .action-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 16px;
      font-family: 'Roboto', sans-serif;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid var(--border-color);
      background-color: #ffffff;
      color: var(--text-main);
    }

    .action-chip .material-symbols-outlined {
      font-size: 16px;
    }

    .action-chip:hover {
      background-color: var(--bg-color);
      border-color: #c6c9ce;
      transform: translateY(-1px);
    }

    .chip-bug:hover {
      color: var(--danger-text);
      border-color: #fad2cf;
      background-color: var(--danger-bg);
    }

    .chip-feature:hover {
      color: #b06000;
      border-color: #feefc3;
      background-color: #fef7e0;
    }

    .chip-creator:hover {
      color: var(--primary-blue);
      border-color: #d2e3fc;
      background-color: #e8f0fe;
    }

    /* Template & Filename Bar */
    .top-control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
    }

    .template-selector-box {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filename-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filename-input {
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      font-weight: bold;
      padding: 5px 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: #ffffff;
      color: var(--primary-blue);
      width: 170px;
      outline: none;
    }

    .filename-input:focus {
      border-color: var(--primary-blue);
    }

    /* Studio Main Grid */
    .studio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      min-height: 520px;
    }

    @media (max-width: 860px) {
      .studio-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Editor Pane (Left) */
    .editor-pane {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(60,64,67,0.06);
    }

    /* Formatting Toolbar */
    .toolbar-deck {
      background: #f8f9fa;
      border-bottom: 1px solid var(--border-color);
      padding: 6px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      align-items: center;
    }

    .tool-btn {
      background: none;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 4px 6px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11.5px;
      font-weight: 500;
      transition: all 0.15s ease;
      min-width: 26px;
      height: 26px;
    }

    .tool-btn:hover {
      background: #e8f0fe;
      border-color: #d2e3fc;
      color: var(--primary-blue);
    }

    .tool-btn .material-symbols-outlined {
      font-size: 16px;
    }

    .tool-divider {
      width: 1px;
      height: 18px;
      background: var(--border-color);
      margin: 0 3px;
    }

    .editor-textarea {
      flex: 1;
      width: 100%;
      min-height: 440px;
      border: none;
      padding: 14px 16px;
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-main);
      background: #ffffff;
      resize: vertical;
      outline: none;
    }

    /* Preview Pane (Right) */
    .preview-pane {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(60,64,67,0.06);
    }

    .preview-header-tabs {
      background: #f8f9fa;
      border-bottom: 1px solid var(--border-color);
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tab-group {
      display: flex;
      gap: 4px;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      background: #e8f0fe;
      color: var(--text-main);
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--primary-blue);
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .preview-content-box {
      flex: 1;
      min-height: 440px;
      overflow-y: auto;
      padding: 16px 20px;
      background: #ffffff;
    }

    /* GitHub-style Markdown Render CSS */
    .markdown-body {
      font-size: 13.5px;
      line-height: 1.6;
      color: #24292f;
      word-wrap: break-word;
    }

    .markdown-body h1 {
      font-size: 20px;
      font-weight: 700;
      padding-bottom: 6px;
      border-bottom: 1px solid #d0d7de;
      margin-top: 16px;
      margin-bottom: 12px;
    }

    .markdown-body h2 {
      font-size: 17px;
      font-weight: 700;
      padding-bottom: 4px;
      border-bottom: 1px solid #d0d7de;
      margin-top: 14px;
      margin-bottom: 10px;
    }

    .markdown-body h3 {
      font-size: 15px;
      font-weight: 700;
      margin-top: 12px;
      margin-bottom: 8px;
    }

    .markdown-body p, .markdown-body ul, .markdown-body ol {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .markdown-body code {
      font-family: 'Roboto Mono', monospace;
      font-size: 85%;
      padding: 2px 5px;
      border-radius: 4px;
      background-color: #f6f8fa;
      color: #24292f;
    }

    .markdown-body pre {
      background-color: #f6f8fa;
      border-radius: 6px;
      padding: 12px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
      border: 1px solid #d0d7de;
      margin-bottom: 12px;
    }

    .markdown-body pre code {
      background: none;
      padding: 0;
      font-size: 100%;
    }

    .markdown-body blockquote {
      margin: 0 0 12px 0;
      padding: 0 12px;
      color: #57606a;
      border-left: 3.5px solid #d0d7de;
    }

    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 14px;
      font-size: 12.5px;
    }

    .markdown-body table th, .markdown-body table td {
      padding: 6px 10px;
      border: 1px solid #d0d7de;
    }

    .markdown-body table th {
      background-color: #f6f8fa;
      font-weight: 700;
    }

    .markdown-body table tr:nth-child(2n) {
      background-color: #f6f8fa;
    }

    .markdown-body img {
      max-width: 100%;
      border-radius: 6px;
    }

    /* GitHub Callout Alerts */
    .markdown-alert {
      padding: 8px 12px;
      margin-bottom: 12px;
      border-left: 3.5px solid;
      border-radius: 0 6px 6px 0;
      font-size: 12.5px;
    }

    .markdown-alert-note {
      background-color: #f0f8ff;
      border-color: #0969da;
      color: #0969da;
    }

    .markdown-alert-tip {
      background-color: #e6f4ea;
      border-color: #137333;
      color: #137333;
    }

    .markdown-alert-important {
      background-color: #f4ecf7;
      border-color: #8250df;
      color: #8250df;
    }

    .markdown-alert-warning {
      background-color: #fff8c5;
      border-color: #9a6700;
      color: #9a6700;
    }

    .markdown-alert-caution {
      background-color: #ffebe9;
      border-color: #cf222e;
      color: #cf222e;
    }

    /* Raw MD Code View */
    .raw-md-view {
      display: none;
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      line-height: 1.5;
      background: #f8f9fa;
      padding: 14px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-all;
      color: #24292f;
      height: 100%;
    }

    /* Document Stats Bar */
    .doc-stats-strip {
      background: #f8f9fa;
      border-top: 1px solid var(--border-color);
      padding: 5px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* Status Box */
    .status-box {
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }

    .status-box.success {
      display: block;
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid #c3e6cb;
    }

    .status-box.error {
      display: block;
      background-color: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid #f5c6cb;
    }

    /* Bottom Toolbar */
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      font-family: 'Google Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 16px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:active {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: scale(1);
    }

    .material-symbols-outlined {
      font-size: 17px;
    }

    .btn-primary {
      background-color: var(--primary-blue);
      color: white;
      min-width: 160px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
      box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
    }

    .btn-secondary {
      background-color: white;
      color: var(--primary-blue);
      border-color: var(--border-color);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #f8f9fa;
      border-color: #dadce0;
    }

    .btn-success,
    .btn-success:hover {
      background-color: var(--success-bg) !important;
      color: var(--success-text) !important;
      border-color: var(--success-bg) !important;
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- Header Bar with Standard Action Chips -->
    <div class="header-bar">
      <div class="header-title-box">
        <span class="material-symbols-outlined" style="font-size: 24px; color: var(--primary-blue);">edit_document</span>
        <h2>Markdown File Creator & Documentation Studio</h2>
      </div>

      <div class="header-actions">
        <a href="mailto:hikapil@google.com?cc=useful-tools@google.com&amp;subject=%5BUser%20Feedback%5D%20%7C%20Bug%20Found%20on%20go%2Fusefultools&amp;body=Hi%20Kapil%2C%0A%0AI%E2%80%99m%20reaching%20out%20to%20report%20a%20bug.%20Here%20are%20the%20relevant%20details%3A%0A%0ABug%20Description%3A%20%5BPlease%20provide%20a%20description%20of%20the%20issue%20here%5D"
          target="_blank" rel="noopener noreferrer" class="action-chip chip-bug" title="Report a Bug">
          <span class="material-symbols-outlined">bug_report</span>
          <span>Report Bug</span>
        </a>

        <a href="mailto:hikapil@google.com?cc=useful-tools@google.com&amp;subject=%5BUser%20Feedback%5D%20%7C%20New%20Tool%2FFeature%20Request%20for%20go%2Fusefultools&amp;body=Hi%20Kapil%2C%0A%0AI%E2%80%99m%20reaching%20out%20to%20request%20a%20new%20feature.%20Here%20are%20the%20relevant%20details%3A%0A%0AFeature%20Request%3A%20%5BPlease%20provide%20a%20description%20of%20the%20feature%20you&#39;d%20like%20to%20see%5D"
          target="_blank" rel="noopener noreferrer" class="action-chip chip-feature" title="Request a New Feature">
          <span class="material-symbols-outlined">lightbulb</span>
          <span>Request Feature</span>
        </a>

        <a href="https://moma.corp.google.com/person/hikapil"
          target="_blank" rel="noopener noreferrer" class="action-chip chip-creator" title="Meet the Creator on Moma">
          <span class="material-symbols-outlined">person</span>
          <span>Meet the Creator</span>
        </a>
      </div>
    </div>

    <!-- Template & File Settings Bar -->
    <div class="top-control-bar">
      <div class="template-selector-box">
        <span style="font-size: 11.5px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">
          Template:
        </span>
        <select id="templateSelect" style="font-size: 12px; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color);" onchange="applyTemplate(this.value)">
          <option value="readme">📄 Project README.md</option>
          <option value="rfc">📐 Design Doc / RFC</option>
          <option value="api">🔌 API Documentation</option>
          <option value="changelog">🚀 Release Notes / Changelog</option>
          <option value="meeting">📝 Meeting Notes & Tasks</option>
          <option value="blank">🌿 Blank Document</option>
        </select>
      </div>

      <div class="filename-box">
        <span style="font-size: 11.5px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">
          File Name:
        </span>
        <input type="text" id="inpFilename" class="filename-input" value="README.md" placeholder="document.md">
      </div>
    </div>

    <!-- Studio Main Split-Screen Grid -->
    <div class="studio-grid">
      <!-- Left: Editor & Toolbar -->
      <div class="editor-pane">
        <!-- Formatting Toolbar -->
        <div class="toolbar-deck">
          <button class="tool-btn" onclick="insertHeading(1)" title="Heading 1 (#)"><strong>H1</strong></button>
          <button class="tool-btn" onclick="insertHeading(2)" title="Heading 2 (##)"><strong>H2</strong></button>
          <button class="tool-btn" onclick="insertHeading(3)" title="Heading 3 (###)"><strong>H3</strong></button>
          
          <div class="tool-divider"></div>

          <button class="tool-btn" onclick="wrapSelection('**', '**')" title="Bold (**text**)">
            <span class="material-symbols-outlined">format_bold</span>
          </button>
          <button class="tool-btn" onclick="wrapSelection('*', '*')" title="Italic (*text*)">
            <span class="material-symbols-outlined">format_italic</span>
          </button>
          <button class="tool-btn" onclick="wrapSelection('~~', '~~')" title="Strikethrough (~~text~~)">
            <span class="material-symbols-outlined">format_strikethrough</span>
          </button>
          <button class="tool-btn" onclick="wrapSelection('`', '`')" title="Inline Code (`code`)">
            <span class="material-symbols-outlined">code</span>
          </button>

          <div class="tool-divider"></div>

          <button class="tool-btn" onclick="insertBulletList()" title="Bullet List (- )">
            <span class="material-symbols-outlined">format_list_bulleted</span>
          </button>
          <button class="tool-btn" onclick="insertNumberedList()" title="Numbered List (1. )">
            <span class="material-symbols-outlined">format_list_numbered</span>
          </button>
          <button class="tool-btn" onclick="insertTaskList()" title="Task Checklist (- [ ])">
            <span class="material-symbols-outlined">checklist</span>
          </button>
          <button class="tool-btn" onclick="wrapSelection('> ', '')" title="Blockquote (> )">
            <span class="material-symbols-outlined">format_quote</span>
          </button>

          <div class="tool-divider"></div>

          <button class="tool-btn" onclick="insertLinkDialog()" title="Insert Link [title](url)">
            <span class="material-symbols-outlined">link</span>
          </button>
          <button class="tool-btn" onclick="insertImageDialog()" title="Insert Image ![alt](url)">
            <span class="material-symbols-outlined">image</span>
          </button>
          <button class="tool-btn" onclick="insertTableDialog()" title="Insert Table">
            <span class="material-symbols-outlined">table</span>
          </button>
          <button class="tool-btn" onclick="insertCodeBlock()" title="Insert Code Block (```)">
            <span class="material-symbols-outlined">data_object</span>
          </button>
          <button class="tool-btn" onclick="insertAlert('NOTE')" title="GitHub Alert [!NOTE]">
            <span class="material-symbols-outlined">info</span>
          </button>
          <button class="tool-btn" onclick="insertTOC()" title="Generate Table of Contents">
            <span class="material-symbols-outlined">toc</span>
          </button>
        </div>

        <!-- The Markdown Raw Textarea -->
        <textarea id="mdInput" class="editor-textarea" placeholder="Start typing your Markdown documentation here..." oninput="handleEditorInput()"></textarea>

        <!-- Document Stats Strip -->
        <div class="doc-stats-strip">
          <div>
            <span id="statWords">0 words</span> • <span id="statChars">0 characters</span> • <span id="statLines">0 lines</span>
          </div>
          <div id="statReadTime">~1 min read</div>
        </div>
      </div>

      <!-- Right: Live Preview & File Inspector -->
      <div class="preview-pane">
        <div class="preview-header-tabs">
          <div class="tab-group">
            <button class="tab-btn active" id="tabBtnPreview" onclick="switchPreviewTab('rendered')">
              <span class="material-symbols-outlined" style="font-size: 15px;">visibility</span>
              Rendered Preview
            </button>
            <button class="tab-btn" id="tabBtnRaw" onclick="switchPreviewTab('raw')">
              <span class="material-symbols-outlined" style="font-size: 15px;">code</span>
              .md File Code
            </button>
          </div>

          <div style="display: flex; gap: 4px; align-items: center;">
            <button class="btn-secondary" style="padding: 2px 8px; font-size: 11px;" onclick="copyMarkdownCode()">
              <span class="material-symbols-outlined" id="copyIcon" style="font-size: 13px;">content_copy</span>
              <span id="copyText">Copy .md</span>
            </button>
          </div>
        </div>

        <div class="preview-content-box" id="previewContainer">
          <!-- Rendered HTML Output -->
          <div class="markdown-body" id="renderedOutput"></div>

          <!-- Raw Code Output -->
          <pre class="raw-md-view" id="rawOutput"></pre>
        </div>
      </div>
    </div>

    <!-- Status Box -->
    <div id="statusBox" class="status-box"></div>

    <!-- Bottom Toolbar -->
    <div class="toolbar">
      <button class="btn-primary" onclick="downloadMarkdownFile()">
        <span class="material-symbols-outlined" id="dlIcon">download</span>
        <span id="dlText">Download .md File</span>
      </button>

      <button class="btn-secondary" onclick="copyMarkdownCode()">
        <span class="material-symbols-outlined">content_copy</span>
        Copy Markdown
      </button>

      <button class="btn-secondary" onclick="downloadHTMLFile()">
        <span class="material-symbols-outlined">html</span>
        Export HTML
      </button>

      <label class="btn-secondary" style="margin: 0; cursor: pointer;">
        <span class="material-symbols-outlined">upload_file</span>
        Open .md File
        <input type="file" accept=".md,.markdown,.txt" style="display: none;" onchange="handleFileUpload(event)">
      </label>

      <button class="btn-secondary" onclick="clearEditor()">
        <span class="material-symbols-outlined">delete_sweep</span>
        Clear
      </button>
    </div>
  </div>

  <script>
    // Templates Library
    const templates = {
      readme: `# Project Title

**Status:** In Review  

## 1. Problem Statement & Motivation

Briefly describe the business need, customer pain points, and why this system is being designed.

## 2. Goals & Non-Goals

### Goals
- Provide 100% in-browser offline tool execution.
- Maintain sub-50ms user interface responsiveness.

### Non-Goals
- Server-side data persistence or cloud storage.

## 3. High-Level Architecture

\`\`\`
+------------------+       +-------------------+       +--------------------+
|  User Interface  | ----> | In-Browser Engine | ----> | Canvas / WebWorker |
+------------------+       +-------------------+       +--------------------+
\`\`\`

## 4. Key Trade-offs & Alternatives

| Approach | Pros | Cons |
| :--- | :--- | :--- |
| **Client-Side WASM** | Total privacy, zero server cost | Slightly larger initial bundle |
| **Server-Side API** | Handles heavy batch workloads | Network latency & privacy overhead |

## 5. Security & Privacy Considerations

> [!IMPORTANT]
> All processing MUST occur in client memory using Web Workers to ensure internal confidential files never leave the machine.

    let currentActiveTab = 'rendered';

    window.addEventListener('DOMContentLoaded', () => {
      // Configure Marked
      marked.setOptions({
        breaks: true,
        gfm: true,
        highlight: function(code, lang) {
          if (lang && hljs.getLanguage(lang)) {
            try {
              return hljs.highlight(code, { language: lang }).value;
            } catch (__) {}
          }
          return hljs.highlightAuto(code).value;
        }
      });

      // Load saved draft or default template
      const saved = localStorage.getItem('md_studio_draft');
      if (saved) {
        document.getElementById('mdInput').value = saved;
      } else {
        document.getElementById('mdInput').value = templates.readme;
      }

      updateLivePreview();
    });

    function handleEditorInput() {
      updateLivePreview();
      // Auto-save draft
      const content = document.getElementById('mdInput').value;
      localStorage.setItem('md_studio_draft', content);
    }

    function updateLivePreview() {
      const md = document.getElementById('mdInput').value;

      // 1. Process custom GitHub alerts like > [!NOTE], > [!TIP]
      let processedMd = md.replace(/^>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*([\s\S]*?)(?=(?:\n\n|\n(?!>)|$))/gim, (match, type, content) => {
        const cleanType = type.toUpperCase();
        const cleanContent = content.replace(/^>\s?/gm, '').trim();
        return `<div class="markdown-alert markdown-alert-${cleanType.toLowerCase()}"><strong>${cleanType}:</strong> ${cleanContent}</div>\n`;
      });

      // 2. Render Markdown to HTML
      const rawHtml = marked.parse(processedMd);
      const cleanHtml = DOMPurify.sanitize(rawHtml);

      document.getElementById('renderedOutput').innerHTML = cleanHtml;
      document.getElementById('rawOutput').textContent = md;

      // 3. Update Document Statistics
      updateStats(md);
    }

    function updateStats(text) {
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const chars = text.length;
      const lines = text ? text.split('\n').length : 0;
      const readMinutes = Math.max(1, Math.ceil(words / 200));

      document.getElementById('statWords').textContent = `${words.toLocaleString()} words`;
      document.getElementById('statChars').textContent = `${chars.toLocaleString()} characters`;
      document.getElementById('statLines').textContent = `${lines.toLocaleString()} lines`;
      document.getElementById('statReadTime').textContent = `~${readMinutes} min read`;
    }

    function switchPreviewTab(tab) {
      currentActiveTab = tab;
      const rendered = document.getElementById('renderedOutput');
      const raw = document.getElementById('rawOutput');
      const btnPreview = document.getElementById('tabBtnPreview');
      const btnRaw = document.getElementById('tabBtnRaw');

      if (tab === 'rendered') {
        rendered.style.display = 'block';
        raw.style.display = 'none';
        btnPreview.classList.add('active');
        btnRaw.classList.remove('active');
      } else {
        rendered.style.display = 'none';
        raw.style.display = 'block';
        btnPreview.classList.remove('active');
        btnRaw.classList.add('active');
      }
    }

    function applyTemplate(tplKey) {
      if (templates[tplKey]) {
        if (confirm('Load template? This will replace your current editor contents.')) {
          document.getElementById('mdInput').value = templates[tplKey];
          
          let fname = 'README.md';
          if (tplKey === 'rfc') fname = 'architecture_rfc.md';
          else if (tplKey === 'api') fname = 'api_reference.md';
          else if (tplKey === 'changelog') fname = 'CHANGELOG.md';
          else if (tplKey === 'meeting') fname = 'meeting_notes.md';
          else if (tplKey === 'blank') fname = 'document.md';
          
          document.getElementById('inpFilename').value = fname;
          handleEditorInput();
          showStatus(`Loaded "${tplKey.toUpperCase()}" template.`, 'success');
        }
      }
    }

    /* Toolbar Helper Functions */
    function wrapSelection(before, after) {
      const textarea = document.getElementById('mdInput');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const selected = text.substring(start, end) || 'text';

      const replacement = before + selected + after;
      textarea.value = text.substring(0, start) + replacement + text.substring(end);
      textarea.focus();
      textarea.setSelectionRange(start + before.length, start + before.length + selected.length);
      handleEditorInput();
    }

    function insertHeading(level) {
      const textarea = document.getElementById('mdInput');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const selected = text.substring(start, end) || `Heading ${level}`;
      const prefix = '#'.repeat(level) + ' ';

      textarea.value = text.substring(0, start) + '\n' + prefix + selected + '\n' + text.substring(end);
      textarea.focus();
      handleEditorInput();
    }

    function insertBulletList() {
      wrapSelection('\n- ', '\n- Item 2\n- Item 3\n');
    }

    function insertNumberedList() {
      wrapSelection('\n1. ', '\n2. Item 2\n3. Item 3\n');
    }

    function insertTaskList() {
      wrapSelection('\n- [ ] ', '\n- [ ] Task 2\n- [x] Completed task\n');
    }

    function insertCodeBlock() {
      wrapSelection('\n```javascript\n', '\n```\n');
    }

    function insertAlert(type) {
      wrapSelection(`\n> [!${type}]\n> `, `\n`);
    }

    function insertLinkDialog() {
      const url = prompt('Enter destination URL:', 'https://');
      if (url) {
        const title = prompt('Enter link text:', 'Click here') || 'link';
        wrapSelection(`[${title}](`, `${url})`);
      }
    }

    function insertImageDialog() {
      const url = prompt('Enter Image URL:', 'https://images.unsplash.com/photo-1555066931-4365d14bab8c');
      if (url) {
        const alt = prompt('Enter Image Alt Text / Caption:', 'Image description') || 'image';
        wrapSelection(`![${alt}](`, `${url})`);
      }
    }

    function insertTableDialog() {
      const table = `\n| Column 1 | Column 2 | Column 3 |
| :--- | :---: | ---: |
| Row 1 Item | Centered | $100.00 |
| Row 2 Item | Centered | $250.00 |\n`;
      wrapSelection(table, '');
    }

    function insertTOC() {
      const text = document.getElementById('mdInput').value;
      const lines = text.split('\n');
      let toc = '\n## Table of Contents\n\n';
      let found = false;

      lines.forEach(line => {
        const match = line.match(/^(#{2,4})\s+(.+)$/);
        if (match) {
          found = true;
          const level = match[1].length - 2;
          const title = match[2].trim();
          const anchor = title.toLowerCase().replace(/[^\w\- ]+/g, '').replace(/\s+/g, '-');
          toc += `${'  '.repeat(level)}- [${title}](#${anchor})\n`;
        }
      });

      if (found) {
        wrapSelection(toc + '\n', '');
        showStatus('Table of contents generated from headings.', 'success');
      } else {
        showStatus('No headings (## or ###) found to build table of contents.', 'error');
      }
    }

    /* File Actions */
    function downloadMarkdownFile() {
      const content = document.getElementById('mdInput').value;
      let filename = document.getElementById('inpFilename').value.trim() || 'document.md';
      if (!filename.endsWith('.md')) filename += '.md';

      const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      triggerSuccessButton('dlIcon', 'dlText', 'File Downloaded!');
      showStatus(`Downloaded "${filename}" successfully.`, 'success');

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 50,
          spread: 55,
          origin: { y: 0.6 }
        });
      }
    }

    function downloadHTMLFile() {
      const renderedHtml = document.getElementById('renderedOutput').innerHTML;
      let filename = document.getElementById('inpFilename').value.trim().replace(/\.[^/.]+$/, '') || 'document';
      filename += '.html';

      const fullHtmlDoc = `<!DOCTYPE html>
<html lang="en">

  <meta charset="UTF-8">

  </style>
</head>

</body>
</html>`;

      const blob = new Blob([fullHtmlDoc], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showStatus(`Exported HTML document "${filename}".`, 'success');
    }

    async function copyMarkdownCode() {
      const content = document.getElementById('mdInput').value;

      try {
        if (navigator.clipboard) {
          await navigator.clipboard.writeText(content);
        } else {
          fallbackCopy(content);
        }
        triggerSuccessButton('copyIcon', 'copyText', 'Copied .md!');
        showStatus('Markdown code copied to clipboard.', 'success');
      } catch (err) {
        fallbackCopy(content);
        triggerSuccessButton('copyIcon', 'copyText', 'Copied .md!');
        showStatus('Markdown code copied to clipboard.', 'success');
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        document.getElementById('mdInput').value = evt.target.result;
        document.getElementById('inpFilename').value = file.name;
        handleEditorInput();
        showStatus(`Opened "${file.name}" (${(file.size / 1024).toFixed(1)} KB).`, 'success');
      };
      reader.readAsText(file);
    }

    function clearEditor() {
      if (confirm('Clear editor? This will reset all text.')) {
        document.getElementById('mdInput').value = '';
        localStorage.removeItem('md_studio_draft');
        handleEditorInput();
        showStatus('Editor cleared.', 'success');
      }
    }

    function triggerSuccessButton(iconId, textId, successText) {
      const icon = document.getElementById(iconId);
      const text = document.getElementById(textId);
      if (!icon || !text) return;
      const originalText = text.innerText;
      const originalIcon = icon.innerText;

      icon.innerText = 'check';
      text.innerText = successText;

      setTimeout(() => {
        icon.innerText = originalIcon;
        text.innerText = originalText;
      }, 2500);
    }

    function showStatus(msg, type) {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = `status-box ${type}`;
      statusBox.textContent = msg;
      setTimeout(() => {
        statusBox.className = 'status-box';
        statusBox.textContent = '';
      }, 4000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
