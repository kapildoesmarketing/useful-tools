<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWT Decoder & Inspector</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500&family=Roboto:wght@400;500&family=Roboto+Mono&display=swap"
    rel="stylesheet">
  <!-- Google Material Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,0,0" />

  <style>
    :root {
      --bg-color: #f8f9fa;
      --border-color: #dadce0;
      --primary-blue: #1a73e8;
      --primary-hover: #174ea6;
      --success-bg: #e6f4ea;
      --success-text: #137333;
      --danger-bg: #fce8e6;
      --danger-text: #c5221f;
      --text-main: #202124;
      --text-secondary: #5f6368;
    }

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #ffffff;
      color: var(--text-main);
      box-sizing: border-box;
    }

    h2,
    .btn {
      font-family: 'Google Sans', sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    textarea {
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-color);
      resize: vertical;
      min-height: 180px;
      color: var(--text-main);
      outline: none;
      transition: background-color 0.3s ease, border-color 0.3s ease;
      line-height: 1.4;
    }

    textarea:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 1px var(--primary-blue);
      background-color: #ffffff;
    }

    .badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    .badge-valid {
      background-color: var(--success-bg);
      color: var(--success-text);
    }

    .badge-expired {
      background-color: var(--danger-bg);
      color: var(--danger-text);
    }

    .flash-clear {
      animation: clearPulse 0.4s ease-out;
    }

    @keyframes clearPulse {
      0% {
        background-color: var(--bg-color);
      }

      50% {
        background-color: #e8eaed;
      }

      100% {
        background-color: var(--bg-color);
      }
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      font-family: 'Google Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: scale(1);
    }

    .material-symbols-outlined {
      font-size: 18px;
    }

    .btn-primary {
      background-color: var(--primary-blue);
      color: white;
      min-width: 140px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
      box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
    }

    .btn-secondary {
      background-color: white;
      color: var(--primary-blue);
      border-color: var(--border-color);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #f8f9fa;
      border-color: #dadce0;
    }

    .btn-success,
    .btn-success:hover {
      background-color: var(--success-bg) !important;
      color: var(--success-text) !important;
      border-color: var(--success-bg) !important;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  
    /* Header Bar: Feedback & Creator Chips */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .action-chip {
      font-family: 'Google Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background-color: #ffffff;
      color: var(--text-secondary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-sizing: border-box;
      line-height: 1;
    }

    .action-chip .material-symbols-outlined {
      font-size: 15px;
    }

    .action-chip:hover {
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.2);
      transform: translateY(-1px);
    }

    .action-chip:active {
      transform: scale(0.95);
    }

    .chip-bug:hover {
      background-color: var(--danger-bg);
      color: var(--danger-text);
      border-color: #f5c6cb;
    }

    .chip-feature:hover {
      background-color: #fef7e0;
      color: #b06000;
      border-color: #f9ab00;
    }

    .chip-creator:hover {
      background-color: #e8f0fe;
      color: var(--primary-blue);
      border-color: #aecbfa;
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- Header Bar: Feedback & Creator Chips -->
    <div class="header-bar">
      <div class="header-actions">
        <a href="mailto:hikapil@google.com?cc=useful-tools@google.com&amp;subject=%5BUser%20Feedback%5D%20%7C%20Bug%20Found%20on%20go%2Fusefultools&amp;body=Hi%20Kapil%2C%0A%0AI%E2%80%99m%20reaching%20out%20to%20report%20a%20bug.%20Here%20are%20the%20relevant%20details%3A%0A%0ABug%20Description%3A%20%5BPlease%20provide%20a%20description%20of%20the%20issue%20here%5D%0ABug%20Screenshot%20(optional)%3A%20%5BPlease%20include%20the%20screenshot%20with%20this%20email%5D"
          target="_blank" rel="noopener noreferrer" class="action-chip chip-bug" title="Report a Bug">
          <span class="material-symbols-outlined">bug_report</span>
          <span>Report Bug</span>
        </a>

        <a href="mailto:hikapil@google.com?cc=useful-tools@google.com&amp;subject=%5BUser%20Feedback%5D%20%7C%20New%20Tool%2FFeature%20Request%20for%20go%2Fusefultools&amp;body=Hi%20Kapil%2C%0A%0AI%E2%80%99m%20reaching%20out%20to%20request%20a%20new%20feature.%20Here%20are%20the%20relevant%20details%3A%0A%0AFeature%20Request%3A%20%5BPlease%20provide%20a%20description%20of%20the%20feature%20you&#39;d%20like%20to%20see%5D%0AWhy%20this%20would%20be%20helpful%3A%20%5BPlease%20explain%20how%20this%20feature%20would%20improve%20your%20experience%5D"
          target="_blank" rel="noopener noreferrer" class="action-chip chip-feature" title="Request a New Feature">
          <span class="material-symbols-outlined">lightbulb</span>
          <span>Request Feature</span>
        </a>

        <a href="https://moma.corp.google.com/person/hikapil"
          target="_blank" rel="noopener noreferrer" class="action-chip chip-creator" title="Meet the Creator on Moma">
          <span class="material-symbols-outlined">person</span>
          <span>Meet the Creator</span>
        </a>
      </div>
    </div>
    <div class="input-group">
      <label for="jwtInput">
        Encoded JWT Token
        <span id="tokenBadge" class="badge" style="display: none;"></span>
      </label>
      <textarea id="jwtInput" placeholder="Paste your JWT token here (eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...)" oninput="startDecode()"></textarea>
    </div>

    <div class="grid">
      <div class="input-group">
        <label for="headerOutput">Header (Algorithm & Token Type)</label>
        <textarea id="headerOutput" readonly placeholder="Decoded header will appear here..."></textarea>
      </div>

      <div class="input-group">
        <label for="payloadOutput">Payload (Claims & Data)</label>
        <textarea id="payloadOutput" readonly placeholder="Decoded payload will appear here..."></textarea>
      </div>
    </div>

    <div class="toolbar">
      <button id="decodeBtn" class="btn-primary" onclick="startDecode()">
        <span class="material-symbols-outlined" id="decodeIcon">key</span>
        <span id="decodeText">Decode Token</span>
      </button>

      <button id="copyPayloadBtn" class="btn-secondary" onclick="copyPayload()">
        <span class="material-symbols-outlined" id="copyIcon">content_copy</span>
        <span id="copyText">Copy Payload</span>
      </button>

      <button class="btn-secondary" onclick="clearAll()" style="color: var(--text-secondary);">
        <span class="material-symbols-outlined">delete</span>
        Clear
      </button>
    </div>
  </div>

  <script>
    function base64UrlDecode(str) {
      let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) {
        base64 += '=';
      }
      const decoded = atob(base64);
      return decodeURIComponent(Array.from(decoded).map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    }

    function startDecode() {
      const token = document.getElementById('jwtInput').value.trim();
      const headerOut = document.getElementById('headerOutput');
      const payloadOut = document.getElementById('payloadOutput');
      const badge = document.getElementById('tokenBadge');
      const btn = document.getElementById('decodeBtn');

      if (!token) {
        headerOut.value = '';
        payloadOut.value = '';
        headerOut.style.color = 'var(--text-main)';
        payloadOut.style.color = 'var(--text-main)';
        badge.style.display = 'none';
        return;
      }

      const parts = token.split('.');
      if (parts.length !== 3) {
        headerOut.style.color = 'var(--danger-text)';
        payloadOut.style.color = 'var(--danger-text)';
        headerOut.value = 'Invalid JWT Token: A JWT must contain exactly 3 dot-separated parts (Header.Payload.Signature).';
        payloadOut.value = 'Invalid JWT Token format.';
        badge.style.display = 'inline-block';
        badge.className = 'badge badge-expired';
        badge.textContent = 'Invalid Format';
        return;
      }

      requestAnimationFrame(() => {
        try {
          const headerObj = JSON.parse(base64UrlDecode(parts[0]));
          const payloadObj = JSON.parse(base64UrlDecode(parts[1]));

          headerOut.style.color = 'var(--text-main)';
          payloadOut.style.color = 'var(--text-main)';
          headerOut.value = JSON.stringify(headerObj, null, 2);
          payloadOut.value = JSON.stringify(payloadObj, null, 2);

          // Expiration check
          badge.style.display = 'inline-block';
          if (payloadObj.exp) {
            const expDate = new Date(payloadObj.exp * 1000);
            const now = new Date();
            if (now > expDate) {
              badge.className = 'badge badge-expired';
              badge.textContent = `Expired (${expDate.toLocaleString()})`;
            } else {
              badge.className = 'badge badge-valid';
              badge.textContent = `Active (Expires: ${expDate.toLocaleString()})`;
            }
          } else {
            badge.className = 'badge badge-valid';
            badge.textContent = 'Valid JWT (No Expiration)';
          }

        } catch (err) {
          headerOut.style.color = 'var(--danger-text)';
          payloadOut.style.color = 'var(--danger-text)';
          headerOut.value = 'Error decoding header: ' + err.message;
          payloadOut.value = 'Error decoding payload: ' + err.message;
          badge.style.display = 'inline-block';
          badge.className = 'badge badge-expired';
          badge.textContent = 'Decode Error';
        }
      });
    }

    function triggerSuccessButton(btnId, iconId, textId, successText) {
      const btn = document.getElementById(btnId);
      const icon = document.getElementById(iconId);
      const text = document.getElementById(textId);

      const originalText = text.innerText;
      const originalIcon = icon.innerText;

      btn.classList.add('btn-success');
      icon.innerText = 'check';
      text.innerText = successText;

      setTimeout(() => {
        btn.classList.remove('btn-success');
        icon.innerText = originalIcon;
        text.innerText = originalText;
      }, 2000);
    }

    function copyPayload() {
      const payloadOut = document.getElementById('payloadOutput');
      if (!payloadOut.value || payloadOut.value.includes('Invalid JWT')) return;

      payloadOut.select();
      document.execCommand('copy');
      triggerSuccessButton('copyPayloadBtn', 'copyIcon', 'copyText', 'Copied!');
    }

    function clearAll() {
      const input = document.getElementById('jwtInput');
      const headerOut = document.getElementById('headerOutput');
      const payloadOut = document.getElementById('payloadOutput');
      const badge = document.getElementById('tokenBadge');

      input.value = '';
      headerOut.value = '';
      payloadOut.value = '';
      headerOut.style.color = 'var(--text-main)';
      payloadOut.style.color = 'var(--text-main)';
      badge.style.display = 'none';

      input.classList.remove('flash-clear');
      headerOut.classList.remove('flash-clear');
      payloadOut.classList.remove('flash-clear');

      void input.offsetWidth;

      input.classList.add('flash-clear');
      headerOut.classList.add('flash-clear');
      payloadOut.classList.add('flash-clear');
    }
  </script>
</body>

</html>
