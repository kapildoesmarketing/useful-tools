<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cryptographic Password Generator & Strength Meter</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500;700&family=Roboto:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <!-- Google Material Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,0,0" />

  <style>
    :root {
      --bg-color: #f8f9fa;
      --border-color: #dadce0;
      --primary-blue: #1a73e8;
      --primary-hover: #174ea6;
      --success-bg: #e6f4ea;
      --success-text: #137333;
      --danger-bg: #fce8e6;
      --danger-text: #c5221f;
      --text-main: #202124;
      --text-secondary: #5f6368;
    }

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #ffffff;
      color: var(--text-main);
      box-sizing: border-box;
    }

    h2,
    .btn {
      font-family: 'Google Sans', sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
    }

    @media (max-width: 860px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    /* Editable Password Display Box */
    .password-display-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #1e1e1e;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .password-display-card input[type="text"],
    .password-display-card input[type="password"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #38bdf8;
      font-family: 'Roboto Mono', monospace;
      font-size: 18px;
    }

    .mask-toggle-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .mask-toggle-btn:hover {
      color: #ffffff;
    }

    /* Options Panel */
    .options-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background-color: var(--bg-color);
      padding: 20px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input {
      cursor: pointer;
    }

    /* Strength Bar & Meter */
    .strength-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: var(--bg-color);
      padding: 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .strength-bar-bg {
      height: 8px;
      background-color: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
    }

    .strength-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--danger-text);
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .checklist-item.valid {
      color: var(--success-text);
      font-weight: 500;
    }

    /* Status Box */
    .status-box {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 6px;
      display: none;
    }

    .status-box.success {
      display: block;
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid #c3e6cb;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      font-family: 'Google Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: scale(1);
    }

    .material-symbols-outlined {
      font-size: 18px;
    }

    .btn-primary {
      background-color: var(--primary-blue);
      color: white;
      min-width: 170px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
      box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
    }

    .btn-secondary {
      background-color: white;
      color: var(--primary-blue);
      border-color: var(--border-color);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #f8f9fa;
      border-color: #dadce0;
    }

    .btn-success,
    .btn-success:hover {
      background-color: var(--success-bg) !important;
      color: var(--success-text) !important;
      border-color: var(--success-bg) !important;
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- Editable Password Display Box -->
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 12px; color: var(--text-secondary);">Type or edit a password to test strength, or click "Generate New Password"</span>
      <div class="password-display-card">
        <input type="text" id="passwordInput" placeholder="Type or generate password..." oninput="evaluateStrength(this.value)">
        
        <button class="mask-toggle-btn" onclick="togglePasswordMask()" title="Show/Hide Password">
          <span class="material-symbols-outlined" id="maskIcon">visibility</span>
        </button>

        <button class="btn-primary" id="copyBtn" style="min-width: auto; padding: 6px 12px; font-size: 12px;" onclick="copyPassword()">
          <span class="material-symbols-outlined" id="copyIcon">content_copy</span>
          <span id="copyText">Copy</span>
        </button>
      </div>
    </div>

    <div class="grid">
      <!-- Left: Generator Settings -->
      <div class="options-panel">
        <label style="font-weight: 700; font-size: 13px; color: var(--primary-blue);">Password Generator Options</label>

        <!-- Mode Selector -->
        <div style="display: flex; gap: 8px;">
          <button class="btn-secondary" id="modeRandomBtn" style="flex: 1; padding: 6px 10px; font-size: 12px;" onclick="setMode('random')">🔒 Random Characters</button>
          <button class="btn-secondary" id="modePassphraseBtn" style="flex: 1; padding: 6px 10px; font-size: 12px;" onclick="setMode('passphrase')">📖 Memorable Passphrase</button>
        </div>

        <!-- Length Slider -->
        <div class="input-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="lengthRange">Password Length:</label>
            <span style="font-weight: 700; font-family: 'Roboto Mono', monospace;" id="lengthVal">16</span>
          </div>
          <input type="range" id="lengthRange" min="6" max="64" value="16" oninput="document.getElementById('lengthVal').textContent=this.value; generatePassword();">
        </div>

        <!-- Character Filters Checkboxes -->
        <div class="checkbox-grid" id="charCheckboxes">
          <label class="checkbox-label"><input type="checkbox" id="chkUpper" checked onchange="generatePassword()"> Uppercase (A-Z)</label>
          <label class="checkbox-label"><input type="checkbox" id="chkLower" checked onchange="generatePassword()"> Lowercase (a-z)</label>
          <label class="checkbox-label"><input type="checkbox" id="chkNumbers" checked onchange="generatePassword()"> Numbers (0-9)</label>
          <label class="checkbox-label"><input type="checkbox" id="chkSymbols" checked onchange="generatePassword()"> Symbols (!@#$%^&*)</label>
          <label class="checkbox-label"><input type="checkbox" id="chkExcludeSimilar" onchange="generatePassword()"> Exclude Similar (i, l, 1, O, 0)</label>
        </div>
      </div>

      <!-- Right: Real-Time Strength Meter & Crack Estimate -->
      <div class="strength-card">
        <label style="font-weight: 700; font-size: 13px; color: var(--primary-blue);">Cryptographic Strength & Entropy</label>

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 13px; font-weight: 700;" id="strengthScoreText">Strong</span>
          <span style="font-size: 11px; color: var(--text-secondary);" id="entropyVal">64 Bits</span>
        </div>

        <div class="strength-bar-bg">
          <div class="strength-bar-fill" id="strengthBar"></div>
        </div>

        <div style="font-size: 12px; color: var(--text-secondary); background: #ffffff; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color);">
          Estimated Crack Time: <strong id="crackTimeText" style="color: var(--text-main);">4,500 Years</strong>
        </div>

        <!-- RegEx Security Checklist -->
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div class="checklist-item" id="chkLenItem">
            <span class="material-symbols-outlined" style="font-size: 16px;" id="chkLenIcon">circle</span> 12+ Characters
          </div>
          <div class="checklist-item" id="chkUpperLowerItem">
            <span class="material-symbols-outlined" style="font-size: 16px;" id="chkUpperLowerIcon">circle</span> Mixed Case Letters
          </div>
          <div class="checklist-item" id="chkNumItem">
            <span class="material-symbols-outlined" style="font-size: 16px;" id="chkNumIcon">circle</span> Numbers & Symbols
          </div>
        </div>
      </div>
    </div>

    <!-- Status Box -->
    <div id="statusBox" class="status-box"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button class="btn-primary" onclick="generatePassword()">
        <span class="material-symbols-outlined">refresh</span>
        Generate New Password
      </button>
    </div>
  </div>

  <script>
    let genMode = 'random'; // 'random' or 'passphrase'

    const upperChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const lowerChars = 'abcdefghijklmnopqrstuvwxyz';
    const numberChars = '0123456789';
    const symbolChars = '!@#$%^&*()_+-=[]{}|;:,.<>?';
    const similarChars = /[il1Lo0O]/g;

    const dicewareWords = ['correct', 'horse', 'battery', 'staple', 'rocket', 'galaxy', 'quantum', 'phoenix', 'shadow', 'thunder', 'emerald', 'sapphire', 'horizon', 'nebula', 'cosmic', 'orbit'];

    window.addEventListener('DOMContentLoaded', () => {
      setMode('random');
    });

    function setMode(mode) {
      genMode = mode;
      document.getElementById('modeRandomBtn').style.fontWeight = mode === 'random' ? '700' : '400';
      document.getElementById('modePassphraseBtn').style.fontWeight = mode === 'passphrase' ? '700' : '400';
      document.getElementById('charCheckboxes').style.display = mode === 'random' ? 'grid' : 'none';

      generatePassword();
    }

    function togglePasswordMask() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('maskIcon');
      if (input.type === 'text') {
        input.type = 'password';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'text';
        icon.textContent = 'visibility';
      }
    }

    function generatePassword() {
      const len = parseInt(document.getElementById('lengthRange').value, 10);
      let pwd = '';

      if (genMode === 'passphrase') {
        const wordCount = Math.max(3, Math.floor(len / 5));
        const words = [];
        const randomValues = new Uint32Array(wordCount);
        window.crypto.getRandomValues(randomValues);

        for (let i = 0; i < wordCount; i++) {
          words.push(dicewareWords[randomValues[i] % dicewareWords.length]);
        }
        pwd = words.join('-');
      } else {
        let pool = '';
        if (document.getElementById('chkUpper').checked) pool += upperChars;
        if (document.getElementById('chkLower').checked) pool += lowerChars;
        if (document.getElementById('chkNumbers').checked) pool += numberChars;
        if (document.getElementById('chkSymbols').checked) pool += symbolChars;

        if (document.getElementById('chkExcludeSimilar').checked) {
          pool = pool.replace(similarChars, '');
        }

        if (!pool) {
          document.getElementById('passwordInput').value = '';
          evaluateStrength('');
          return;
        }

        const randomValues = new Uint32Array(len);
        window.crypto.getRandomValues(randomValues);

        for (let i = 0; i < len; i++) {
          pwd += pool[randomValues[i] % pool.length];
        }
      }

      document.getElementById('passwordInput').value = pwd;
      evaluateStrength(pwd);
    }

    function evaluateStrength(pwd) {
      const inputVal = pwd || '';
      const len = inputVal.length;

      if (!inputVal) {
        document.getElementById('entropyVal').textContent = '0 Bits Entropy';
        document.getElementById('strengthScoreText').textContent = 'Empty';
        document.getElementById('strengthScoreText').style.color = 'var(--text-secondary)';
        document.getElementById('strengthBar').style.width = '0%';
        document.getElementById('crackTimeText').textContent = 'N/A';
        updateChecklistItem('chkLenItem', 'chkLenIcon', false);
        updateChecklistItem('chkUpperLowerItem', 'chkUpperLowerIcon', false);
        updateChecklistItem('chkNumItem', 'chkNumIcon', false);
        return;
      }

      let poolSize = 0;
      if (/[A-Z]/.test(inputVal)) poolSize += 26;
      if (/[a-z]/.test(inputVal)) poolSize += 26;
      if (/[0-9]/.test(inputVal)) poolSize += 10;
      if (/[^A-Za-z0-9]/.test(inputVal)) poolSize += 32;

      // Entropy = log2(poolSize ^ length)
      const entropy = Math.floor(len * Math.log2(poolSize || 1));
      document.getElementById('entropyVal').textContent = `${entropy} Bits Entropy`;

      // Strength Score
      const bar = document.getElementById('strengthBar');
      const scoreText = document.getElementById('strengthScoreText');
      const crackText = document.getElementById('crackTimeText');

      let fillPercent = Math.min(100, (entropy / 90) * 100);
      bar.style.width = `${fillPercent}%`;

      if (entropy < 40) {
        bar.style.backgroundColor = 'var(--danger-text)';
        scoreText.textContent = 'Weak';
        scoreText.style.color = 'var(--danger-text)';
        crackText.textContent = 'Instant to Minutes';
      } else if (entropy < 65) {
        bar.style.backgroundColor = '#f59e0b';
        scoreText.textContent = 'Moderate';
        scoreText.style.color = '#f59e0b';
        crackText.textContent = 'Days to Months';
      } else if (entropy < 85) {
        bar.style.backgroundColor = 'var(--primary-blue)';
        scoreText.textContent = 'Strong';
        scoreText.style.color = 'var(--primary-blue)';
        crackText.textContent = 'Thousands of Years';
      } else {
        bar.style.backgroundColor = 'var(--success-text)';
        scoreText.textContent = 'Unbreakable 🛡️';
        scoreText.style.color = 'var(--success-text)';
        crackText.textContent = 'Trillions of Years';
      }

      // Checklists
      updateChecklistItem('chkLenItem', 'chkLenIcon', len >= 12);
      updateChecklistItem('chkUpperLowerItem', 'chkUpperLowerIcon', /[A-Z]/.test(inputVal) && /[a-z]/.test(inputVal));
      updateChecklistItem('chkNumItem', 'chkNumIcon', /[0-9]/.test(inputVal) && /[^A-Za-z0-9]/.test(inputVal));
    }

    function updateChecklistItem(itemId, iconId, isValid) {
      const item = document.getElementById(itemId);
      const icon = document.getElementById(iconId);
      if (isValid) {
        item.classList.add('valid');
        icon.textContent = 'check_circle';
      } else {
        item.classList.remove('valid');
        icon.textContent = 'circle';
      }
    }

    function copyPassword() {
      const pwd = document.getElementById('passwordInput').value;
      if (!pwd) return;

      try {
        navigator.clipboard.writeText(pwd);
        triggerSuccessButton('copyBtn', 'copyIcon', 'copyText', 'Copied!');
      } catch (e) {
        const temp = document.createElement('input');
        temp.value = pwd;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        triggerSuccessButton('copyBtn', 'copyIcon', 'copyText', 'Copied!');
      }
    }

    function triggerSuccessButton(btnId, iconId, textId, successText) {
      const btn = document.getElementById(btnId);
      const icon = document.getElementById(iconId);
      const text = document.getElementById(textId);

      const originalText = text.innerText;
      const originalIcon = icon.innerText;

      btn.classList.add('btn-success');
      icon.innerText = 'check';
      text.innerText = successText;

      setTimeout(() => {
        btn.classList.remove('btn-success');
        icon.innerText = originalIcon;
        text.innerText = originalText;
      }, 2000);
    }
  </script>
</body>

</html>
