<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Password Remover & Protector Studio</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500;700&family=Roboto:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <!-- Google Material Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,0,0" />
  <!-- PDF.js, PDF-LIB, and jsPDF CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-color: #f8f9fa;
      --border-color: #dadce0;
      --primary-blue: #1a73e8;
      --primary-hover: #174ea6;
      --success-bg: #e6f4ea;
      --success-text: #137333;
      --danger-bg: #fce8e6;
      --danger-text: #c5221f;
      --text-main: #202124;
      --text-secondary: #5f6368;
    }

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #ffffff;
      color: var(--text-main);
      box-sizing: border-box;
    }

    h2,
    .btn {
      font-family: 'Google Sans', sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 860px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    /* Drag and Drop Zone */
    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      background-color: var(--bg-color);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: var(--primary-blue);
      background-color: #e8f0fe;
    }

    /* Action Card Options */
    .action-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background-color: var(--bg-color);
      padding: 20px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
    }

    .password-row {
      display: flex;
      align-items: center;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px 8px;
    }

    .password-row input {
      flex: 1;
      border: none;
      outline: none;
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      padding: 6px;
      color: var(--text-main);
    }

    .mask-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .mask-btn:hover {
      color: var(--primary-blue);
    }

    /* Status Box */
    .status-box {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 6px;
      display: none;
    }

    .status-box.success {
      display: block;
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid #c3e6cb;
    }

    .status-box.error {
      display: block;
      background-color: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid #f5c6cb;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      font-family: 'Google Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: scale(1);
    }

    .material-symbols-outlined {
      font-size: 18px;
    }

    .btn-primary {
      background-color: var(--primary-blue);
      color: white;
      min-width: 170px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
      box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
    }

    .btn-secondary {
      background-color: white;
      color: var(--primary-blue);
      border-color: var(--border-color);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #f8f9fa;
      border-color: #dadce0;
    }

    .btn-success,
    .btn-success:hover {
      background-color: var(--success-bg) !important;
      color: var(--success-text) !important;
      border-color: var(--success-bg) !important;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="grid">
      <!-- Left: File Upload & Status -->
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
          <span class="material-symbols-outlined" style="font-size: 44px; color: var(--primary-blue);" id="dropIcon">lock_open</span>
          <div>
            <strong>Click to upload PDF document</strong> or drag & drop file
          </div>
          <span style="font-size: 12px; color: var(--text-secondary);">Unlock protected PDFs or add password protection</span>
        </div>
        <input type="file" id="fileInput" accept="application/pdf" style="display: none;" onchange="handleFileSelect(event)">

        <div style="background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 6px;">
          <label style="font-weight: 500;">Document Info</label>
          <div style="font-size: 13px; color: var(--text-main);" id="docInfoText">No PDF file loaded yet.</div>
        </div>
      </div>

      <!-- Right: Mode Action Panel -->
      <div class="action-panel">
        <label style="font-weight: 700; font-size: 13px; color: var(--primary-blue);">Cryptographic Action Mode</label>

        <!-- Mode Selector -->
        <div style="display: flex; gap: 8px;">
          <button class="btn-secondary" id="modeUnlockBtn" style="flex: 1; padding: 6px 10px; font-size: 12px;" onclick="setMode('unlock')">🔓 Unlock PDF (Remove Password)</button>
          <button class="btn-secondary" id="modeLockBtn" style="flex: 1; padding: 6px 10px; font-size: 12px;" onclick="setMode('lock')">🔒 Protect PDF (Set Password)</button>
        </div>

        <!-- Password Input -->
        <div class="input-group">
          <label for="pwdInput" id="pwdLabel">Known Password to Unlock PDF:</label>
          <div class="password-row">
            <input type="password" id="pwdInput" placeholder="Enter password..." oninput="updateActionState()">
            <button class="mask-btn" onclick="togglePasswordMask()" title="Show/Hide Password">
              <span class="material-symbols-outlined" id="maskIcon">visibility_off</span>
            </button>
          </div>
        </div>

        <div style="font-size: 12px; color: var(--text-secondary); background: #ffffff; padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); line-height: 1.4;" id="modeDescText">
          <strong>Unlock Mode:</strong> Provide the known password to decrypt a protected PDF and export a clean, unencrypted version.
        </div>
      </div>
    </div>

    <!-- Status Box -->
    <div id="statusBox" class="status-box"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button id="processBtn" class="btn-primary" onclick="processPdfAction()" disabled>
        <span class="material-symbols-outlined" id="actionIcon">lock_open</span>
        <span id="actionText">Unlock & Save Clean PDF</span>
      </button>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfArrayBuffer = null;
    let pdfFileName = 'document';
    let isProtectedDoc = false;
    let currentMode = 'unlock'; // 'unlock' or 'lock'

    window.addEventListener('DOMContentLoaded', () => {
      setupDragAndDrop();
      setMode('unlock');
    });

    function setupDragAndDrop() {
      const zone = document.getElementById('dropZone');
      ['dragenter', 'dragover'].forEach(name => {
        zone.addEventListener(name, (e) => { e.preventDefault(); zone.classList.add('dragover'); });
      });
      ['dragleave', 'drop'].forEach(name => {
        zone.addEventListener(name, (e) => { e.preventDefault(); zone.classList.remove('dragover'); });
      });
      zone.addEventListener('drop', (e) => {
        if (e.dataTransfer.files.length > 0) {
          loadPdfFile(e.dataTransfer.files[0]);
        }
      });
    }

    function handleFileSelect(e) {
      if (e.target.files.length > 0) {
        loadPdfFile(e.target.files[0]);
      }
    }

    async function loadPdfFile(file) {
      if (!file || file.type !== 'application/pdf') return;

      pdfFileName = file.name.replace(/\.pdf$/i, '');
      pdfArrayBuffer = await file.arrayBuffer();

      try {
        const loadingTask = pdfjsLib.getDocument({ data: pdfArrayBuffer.slice(0) });
        await loadingTask.promise;
        isProtectedDoc = false;

        document.getElementById('docInfoText').innerHTML = `
          <strong>${escapeHtml(file.name)}</strong> (${formatFileSize(file.size)})<br>
          <span style="color: var(--success-text); font-weight: 500;">Status: Unencrypted PDF</span>
        `;
        showStatus('PDF loaded successfully!', 'success');
      } catch (e) {
        if (e.name === 'PasswordException') {
          isProtectedDoc = true;
          document.getElementById('docInfoText').innerHTML = `
            <strong>${escapeHtml(file.name)}</strong> (${formatFileSize(file.size)})<br>
            <span style="color: var(--danger-text); font-weight: 500;">Status: Password Protected PDF 🔒</span>
          `;
          setMode('unlock');
          showStatus('PDF is password protected. Enter known password on the right to unlock.', 'error');
        } else {
          showStatus('Error loading PDF file.', 'error');
        }
      }

      updateActionState();
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modeUnlockBtn').style.fontWeight = mode === 'unlock' ? '700' : '400';
      document.getElementById('modeLockBtn').style.fontWeight = mode === 'lock' ? '700' : '400';

      const label = document.getElementById('pwdLabel');
      const desc = document.getElementById('modeDescText');
      const actionText = document.getElementById('actionText');
      const actionIcon = document.getElementById('actionIcon');
      const dropIcon = document.getElementById('dropIcon');

      if (mode === 'unlock') {
        label.textContent = 'Known Password to Unlock PDF:';
        desc.innerHTML = '<strong>Unlock Mode:</strong> Provide the known password to decrypt a protected PDF and export a clean, unencrypted version.';
        actionText.textContent = 'Unlock & Save Clean PDF';
        actionIcon.textContent = 'lock_open';
        dropIcon.textContent = 'lock_open';
      } else {
        label.textContent = 'New Password to Protect PDF:';
        desc.innerHTML = '<strong>Protect Mode:</strong> Set a custom password to encrypt and lock your PDF document.';
        actionText.textContent = 'Encrypt & Download Protected PDF';
        actionIcon.textContent = 'lock';
        dropIcon.textContent = 'lock';
      }

      updateActionState();
    }

    function togglePasswordMask() {
      const input = document.getElementById('pwdInput');
      const icon = document.getElementById('maskIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility_off';
      }
    }

    function updateActionState() {
      const pwd = document.getElementById('pwdInput').value;
      const btn = document.getElementById('processBtn');

      if (!pdfArrayBuffer) {
        btn.disabled = true;
        return;
      }

      if (currentMode === 'unlock') {
        btn.disabled = isProtectedDoc && !pwd;
      } else {
        btn.disabled = !pwd;
      }
    }

    async function processPdfAction() {
      if (!pdfArrayBuffer) return;
      const pwd = document.getElementById('pwdInput').value;

      triggerProcessingButton(true);

      try {
        if (currentMode === 'unlock') {
          // Decrypt & Remove Password using PDF-LIB
          const loadOptions = pwd ? { password: pwd } : {};
          const srcDoc = await PDFLib.PDFDocument.load(pdfArrayBuffer.slice(0), loadOptions);
          const dstDoc = await PDFLib.PDFDocument.create();

          const pageIndices = srcDoc.getPageIndices();
          const copiedPages = await dstDoc.copyPages(srcDoc, pageIndices);
          copiedPages.forEach(p => dstDoc.addPage(p));

          const cleanPdfBytes = await dstDoc.save();
          downloadBlob(cleanPdfBytes, `${pdfFileName}_unlocked_clean.pdf`, 'application/pdf');

          showStatus('Password removed successfully! Clean unencrypted PDF downloaded.', 'success');
        } else {
          // Protect & Encrypt PDF using PDF.js + jsPDF with encryption
          const pdfDoc = await pdfjsLib.getDocument({ data: pdfArrayBuffer.slice(0) }).promise;
          const numPages = pdfDoc.numPages;

          const { jsPDF } = window.jspdf;
          let doc = null;

          for (let i = 1; i <= numPages; i++) {
            const page = await pdfDoc.getPage(i);
            const viewport = page.getViewport({ scale: 1.5 });

            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');

            await page.render({ canvasContext: ctx, viewport }).promise;
            const imgData = canvas.toDataURL('image/jpeg', 0.92);

            const orientation = viewport.width > viewport.height ? 'l' : 'p';

            if (i === 1) {
              doc = new jsPDF({
                orientation: orientation,
                unit: 'px',
                format: [viewport.width, viewport.height],
                encryption: {
                  userPassword: pwd,
                  ownerPassword: pwd,
                  userPermissions: ["print", "modify", "copy"]
                }
              });
              doc.addImage(imgData, 'JPEG', 0, 0, viewport.width, viewport.height);
            } else {
              doc.addPage([viewport.width, viewport.height], orientation);
              doc.addImage(imgData, 'JPEG', 0, 0, viewport.width, viewport.height);
            }
          }

          doc.save(`${pdfFileName}_protected.pdf`);
          showStatus('PDF encrypted & password protected successfully!', 'success');
        }
      } catch (e) {
        console.error(e);
        const errDetail = e && e.message ? e.message : 'Unknown error';
        showStatus(`Operation error: ${errDetail}`, 'error');
      }

      triggerProcessingButton(false);
    }

    function downloadBlob(bytes, filename, mime) {
      const blob = new Blob([bytes], { type: mime });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function triggerProcessingButton(active) {
      const btn = document.getElementById('processBtn');
      btn.disabled = active;
    }

    function formatFileSize(bytes) {
      if (!bytes) return '0 B';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function showStatus(msg, type) {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = `status-box ${type}`;
      statusBox.textContent = msg;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>

</html>
