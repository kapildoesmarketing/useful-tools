<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Page Extractor & Thumbnail Grid Studio</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500;700&family=Roboto:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <!-- Google Material Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,0,0" />
  <!-- PDF.js, PDF-LIB, and JSZip CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-color: #f8f9fa;
      --border-color: #dadce0;
      --primary-blue: #1a73e8;
      --primary-hover: #174ea6;
      --success-bg: #e6f4ea;
      --success-text: #137333;
      --danger-bg: #fce8e6;
      --danger-text: #c5221f;
      --text-main: #202124;
      --text-secondary: #5f6368;
    }

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #ffffff;
      color: var(--text-main);
      box-sizing: border-box;
    }

    h2,
    .btn {
      font-family: 'Google Sans', sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
    }

    @media (max-width: 860px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    /* Drag and Drop Zone */
    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 28px;
      text-align: center;
      background-color: var(--bg-color);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: var(--primary-blue);
      background-color: #e8f0fe;
    }

    /* Interactive Thumbnail Grid */
    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      max-height: 480px;
      overflow-y: auto;
      padding: 4px;
    }

    .thumb-card {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .thumb-card:hover {
      border-color: var(--primary-blue);
    }

    .thumb-card.selected {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 2px var(--primary-blue);
      background-color: #f0f7ff;
    }

    .thumb-canvas-box {
      width: 100%;
      height: 180px;
      background-color: #f1f5f9;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-canvas-box canvas {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .thumb-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* Options Panel */
    .options-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: var(--bg-color);
      padding: 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-main);
    }

    input[type="text"] {
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: #ffffff;
      color: var(--text-main);
      outline: none;
    }

    /* Status Box */
    .status-box {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 6px;
      display: none;
    }

    .status-box.success {
      display: block;
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid #c3e6cb;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      font-family: 'Google Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: scale(1);
    }

    .material-symbols-outlined {
      font-size: 18px;
    }

    .btn-primary {
      background-color: var(--primary-blue);
      color: white;
      min-width: 170px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
      box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
    }

    .btn-secondary {
      background-color: white;
      color: var(--primary-blue);
      border-color: var(--border-color);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #f8f9fa;
      border-color: #dadce0;
    }

    .btn-success,
    .btn-success:hover {
      background-color: var(--success-bg) !important;
      color: var(--success-text) !important;
      border-color: var(--success-bg) !important;
    }
  
    /* Header Bar: Feedback & Creator Chips */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .action-chip {
      font-family: 'Google Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background-color: #ffffff;
      color: var(--text-secondary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-sizing: border-box;
      line-height: 1;
    }

    .action-chip .material-symbols-outlined {
      font-size: 15px;
    }

    .action-chip:hover {
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.2);
      transform: translateY(-1px);
    }

    .action-chip:active {
      transform: scale(0.95);
    }

    .chip-bug:hover {
      background-color: var(--danger-bg);
      color: var(--danger-text);
      border-color: #f5c6cb;
    }

    .chip-feature:hover {
      background-color: #fef7e0;
      color: #b06000;
      border-color: #f9ab00;
    }

    .chip-creator:hover {
      background-color: #e8f0fe;
      color: var(--primary-blue);
      border-color: #aecbfa;
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- Header Bar: Feedback & Creator Chips -->
    <div class="header-bar">
      <div class="header-actions">
        <a href="mailto:hikapil@google.com?cc=useful-tools@google.com&amp;subject=%5BUser%20Feedback%5D%20%7C%20Bug%20Found%20on%20go%2Fusefultools&amp;body=Hi%20Kapil%2C%0A%0AI%E2%80%99m%20reaching%20out%20to%20report%20a%20bug.%20Here%20are%20the%20relevant%20details%3A%0A%0ABug%20Description%3A%20%5BPlease%20provide%20a%20description%20of%20the%20issue%20here%5D%0ABug%20Screenshot%20(optional)%3A%20%5BPlease%20include%20the%20screenshot%20with%20this%20email%5D"
          target="_blank" rel="noopener noreferrer" class="action-chip chip-bug" title="Report a Bug">
          <span class="material-symbols-outlined">bug_report</span>
          <span>Report Bug</span>
        </a>

        <a href="mailto:hikapil@google.com?cc=useful-tools@google.com&amp;subject=%5BUser%20Feedback%5D%20%7C%20New%20Tool%2FFeature%20Request%20for%20go%2Fusefultools&amp;body=Hi%20Kapil%2C%0A%0AI%E2%80%99m%20reaching%20out%20to%20request%20a%20new%20feature.%20Here%20are%20the%20relevant%20details%3A%0A%0AFeature%20Request%3A%20%5BPlease%20provide%20a%20description%20of%20the%20feature%20you&#39;d%20like%20to%20see%5D%0AWhy%20this%20would%20be%20helpful%3A%20%5BPlease%20explain%20how%20this%20feature%20would%20improve%20your%20experience%5D"
          target="_blank" rel="noopener noreferrer" class="action-chip chip-feature" title="Request a New Feature">
          <span class="material-symbols-outlined">lightbulb</span>
          <span>Request Feature</span>
        </a>

        <a href="https://moma.corp.google.com/person/hikapil"
          target="_blank" rel="noopener noreferrer" class="action-chip chip-creator" title="Meet the Creator on Moma">
          <span class="material-symbols-outlined">person</span>
          <span>Meet the Creator</span>
        </a>
      </div>
    </div>
    <div class="grid">
      <!-- Left: PDF Uploader & Thumbnail Grid -->
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
          <span class="material-symbols-outlined" style="font-size: 36px; color: var(--primary-blue);">picture_as_pdf</span>
          <div>
            <strong>Click to upload a PDF file</strong> or drag & drop here
          </div>
          <span style="font-size: 12px; color: var(--text-secondary);">Renders page thumbnails for interactive selection</span>
        </div>
        <input type="file" id="fileInput" accept="application/pdf" style="display: none;" onchange="handleFileSelect(event)">

        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
          <label style="font-weight: 500;">PDF Page Selection (<span id="selectedCount">0</span> of <span id="totalPagesCount">0</span> Selected)</label>
          <div style="display: flex; gap: 4px;">
            <button class="btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="selectPages('all')">Select All</button>
            <button class="btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="selectPages('none')">Deselect All</button>
            <button class="btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="selectPages('odd')">Odd</button>
            <button class="btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="selectPages('even')">Even</button>
          </div>
        </div>

        <!-- Thumbnail Grid -->
        <div class="thumb-grid" id="thumbGrid">
          <div style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 40px; font-size: 13px;">
            No PDF loaded yet. Upload a PDF file above to extract specific pages!
          </div>
        </div>
      </div>

      <!-- Right: Range Selection & Extraction Options -->
      <div class="options-panel">
        <label style="font-weight: 700; font-size: 13px; color: var(--primary-blue);">Extraction Settings</label>

        <div class="input-group">
          <label for="rangeInput">Page Range (e.g. 1-3, 5, 8-10):</label>
          <input type="text" id="rangeInput" placeholder="1-3, 5..." oninput="applyRangeInput(this.value)">
        </div>

        <div style="font-size: 12px; color: var(--text-secondary); background: #ffffff; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color);">
          Selected Pages: <strong id="selectedListSummary" style="color: var(--primary-blue);">None</strong>
        </div>
      </div>
    </div>

    <!-- Status Box -->
    <div id="statusBox" class="status-box"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button id="extractPdfBtn" class="btn-primary" onclick="extractPdfPages()" disabled>
        <span class="material-symbols-outlined">file_download</span>
        Download Extracted PDF
      </button>

      <button id="extractZipBtn" class="btn-secondary" onclick="extractPngZip()" disabled>
        <span class="material-symbols-outlined">folder_zip</span>
        Download Pages as PNG ZIP
      </button>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfDoc = null;
    let pdfArrayBuffer = null;
    let totalPages = 0;
    let selectedPagesMap = new Set();
    let pdfFileName = 'document';

    window.addEventListener('DOMContentLoaded', () => {
      setupDragAndDrop();
    });

    function setupDragAndDrop() {
      const zone = document.getElementById('dropZone');
      ['dragenter', 'dragover'].forEach(name => {
        zone.addEventListener(name, (e) => { e.preventDefault(); zone.classList.add('dragover'); });
      });
      ['dragleave', 'drop'].forEach(name => {
        zone.addEventListener(name, (e) => { e.preventDefault(); zone.classList.remove('dragover'); });
      });
      zone.addEventListener('drop', (e) => {
        if (e.dataTransfer.files.length > 0) {
          loadPdfFile(e.dataTransfer.files[0]);
        }
      });
    }

    function handleFileSelect(e) {
      if (e.target.files.length > 0) {
        loadPdfFile(e.target.files[0]);
      }
    }

    async function loadPdfFile(file) {
      if (!file || file.type !== 'application/pdf') return;

      pdfFileName = file.name.replace(/\.pdf$/i, '');
      pdfArrayBuffer = await file.arrayBuffer();

      try {
        pdfDoc = await pdfjsLib.getDocument({ data: pdfArrayBuffer.slice(0) }).promise;
        totalPages = pdfDoc.numPages;
        selectedPagesMap.clear();

        // Select all by default
        for (let i = 1; i <= totalPages; i++) selectedPagesMap.add(i);

        document.getElementById('totalPagesCount').textContent = totalPages;
        renderThumbnails();
      } catch (e) {
        console.error(e);
        showStatus('Error loading PDF file. Ensure file is not password protected.', 'error');
      }
    }

    async function renderThumbnails() {
      const grid = document.getElementById('thumbGrid');
      grid.innerHTML = '';

      for (let i = 1; i <= totalPages; i++) {
        const page = await pdfDoc.getPage(i);
        const viewport = page.getViewport({ scale: 0.3 });

        const card = document.createElement('div');
        card.className = `thumb-card ${selectedPagesMap.has(i) ? 'selected' : ''}`;
        card.id = `thumb_card_${i}`;
        card.onclick = () => togglePageSelection(i);

        const canvasBox = document.createElement('div');
        canvasBox.className = 'thumb-canvas-box';

        const canvas = document.createElement('canvas');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport }).promise;

        canvasBox.appendChild(canvas);

        const footer = document.createElement('div');
        footer.className = 'thumb-footer';
        footer.innerHTML = `
          <span>Page ${i}</span>
          <input type="checkbox" ${selectedPagesMap.has(i) ? 'checked' : ''} onclick="event.stopPropagation(); togglePageSelection(${i});">
        `;

        card.appendChild(canvasBox);
        card.appendChild(footer);
        grid.appendChild(card);
      }

      updateSelectionUI();
    }

    function togglePageSelection(pageNum) {
      if (selectedPagesMap.has(pageNum)) {
        selectedPagesMap.delete(pageNum);
      } else {
        selectedPagesMap.add(pageNum);
      }

      const card = document.getElementById(`thumb_card_${pageNum}`);
      if (card) {
        card.classList.toggle('selected', selectedPagesMap.has(pageNum));
        const chk = card.querySelector('input[type="checkbox"]');
        if (chk) chk.checked = selectedPagesMap.has(pageNum);
      }

      updateSelectionUI();
    }

    function selectPages(type) {
      selectedPagesMap.clear();
      for (let i = 1; i <= totalPages; i++) {
        if (type === 'all') selectedPagesMap.add(i);
        else if (type === 'odd' && i % 2 !== 0) selectedPagesMap.add(i);
        else if (type === 'even' && i % 2 === 0) selectedPagesMap.add(i);
      }

      for (let i = 1; i <= totalPages; i++) {
        const card = document.getElementById(`thumb_card_${i}`);
        if (card) {
          card.classList.toggle('selected', selectedPagesMap.has(i));
          const chk = card.querySelector('input[type="checkbox"]');
          if (chk) chk.checked = selectedPagesMap.has(i);
        }
      }

      updateSelectionUI();
    }

    function applyRangeInput(rangeStr) {
      if (!rangeStr.trim() || totalPages === 0) return;

      selectedPagesMap.clear();
      const parts = rangeStr.split(',');

      parts.forEach(part => {
        const p = part.trim();
        if (p.includes('-')) {
          const [start, end] = p.split('-').map(n => parseInt(n.trim(), 10));
          if (!isNaN(start) && !isNaN(end)) {
            for (let i = Math.max(1, start); i <= Math.min(totalPages, end); i++) {
              selectedPagesMap.add(i);
            }
          }
        } else {
          const num = parseInt(p, 10);
          if (!isNaN(num) && num >= 1 && num <= totalPages) {
            selectedPagesMap.add(num);
          }
        }
      });

      for (let i = 1; i <= totalPages; i++) {
        const card = document.getElementById(`thumb_card_${i}`);
        if (card) {
          card.classList.toggle('selected', selectedPagesMap.has(i));
          const chk = card.querySelector('input[type="checkbox"]');
          if (chk) chk.checked = selectedPagesMap.has(i);
        }
      }

      updateSelectionUI();
    }

    function updateSelectionUI() {
      const arr = Array.from(selectedPagesMap).sort((a, b) => a - b);
      document.getElementById('selectedCount').textContent = arr.length;
      document.getElementById('extractPdfBtn').disabled = arr.length === 0;
      document.getElementById('extractZipBtn').disabled = arr.length === 0;

      document.getElementById('selectedListSummary').textContent = arr.length > 0 ? arr.join(', ') : 'None';
    }

    async function extractPdfPages() {
      const pageIndices = Array.from(selectedPagesMap).sort((a, b) => a - b).map(p => p - 1);
      if (pageIndices.length === 0) return;

      try {
        const srcDoc = await PDFLib.PDFDocument.load(pdfArrayBuffer.slice(0));
        const dstDoc = await PDFLib.PDFDocument.create();

        const copiedPages = await dstDoc.copyPages(srcDoc, pageIndices);
        copiedPages.forEach(p => dstDoc.addPage(p));

        const pdfBytes = await dstDoc.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });

        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${pdfFileName}_extracted.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        showStatus(`Extracted ${pageIndices.length} pages into new PDF successfully!`, 'success');
      } catch (e) {
        console.error(e);
        showStatus('Error generating extracted PDF.', 'error');
      }
    }

    async function extractPngZip() {
      const pageIndices = Array.from(selectedPagesMap).sort((a, b) => a - b);
      if (pageIndices.length === 0) return;

      const zip = new JSZip();

      for (let pNum of pageIndices) {
        const page = await pdfDoc.getPage(pNum);
        const viewport = page.getViewport({ scale: 1.5 });

        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');

        await page.render({ canvasContext: ctx, viewport }).promise;
        const dataUrl = canvas.toDataURL('image/png');
        const base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");

        zip.file(`page_${pNum}.png`, base64Data, { base64: true });
      }

      const content = await zip.generateAsync({ type: "blob" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(content);
      a.download = `${pdfFileName}_pages_png.zip`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      showStatus(`Exported ${pageIndices.length} PNG page images to ZIP!`, 'success');
    }

    function showStatus(msg, type) {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = `status-box ${type}`;
      statusBox.textContent = msg;
    }
  </script>
</body>

</html>
